<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>全球锂资源项目地图与数据库（2026）</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    :root {
      --bg: #0b1020;
      --panel: #11182d;
      --panel2: #17203a;
      --text: #eef3ff;
      --muted: #a8b2cc;
      --line: #2a365d;
      --accent: #78a7ff;
      --green: #4ade80;
      --orange: #f59e0b;
      --purple: #a78bfa;
      --red: #fb7185;
      --gray: #94a3b8;
      --cyan: #22d3ee;
      --gold: #f6c453;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    html,
    body {
      margin: 0;
      padding: 0;
      scroll-behavior: smooth;
      background:
        radial-gradient(circle at top left, rgba(120, 167, 255, 0.14), transparent 30%),
        radial-gradient(circle at top right, rgba(246, 196, 83, 0.09), transparent 24%),
        var(--bg);
      color: var(--text);
      font-family: "IBM Plex Sans", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .wrap {
      width: min(1600px, 96vw);
      margin: 18px auto 28px;
    }

    .top {
      display: grid;
      grid-template-columns: minmax(0, 1.22fr) minmax(340px, 0.92fr);
      gap: 16px;
      margin-bottom: 16px;
    }

    .side-stack {
      display: grid;
      gap: 16px;
    }

    .card {
      background: linear-gradient(180deg, rgba(17, 24, 45, 0.96), rgba(23, 32, 58, 0.96));
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }

    .card[id],
    .company-block {
      scroll-margin-top: 86px;
    }

    .hero {
      padding: 24px 26px;
      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: auto -12% -45% auto;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(120, 167, 255, 0.22), transparent 65%);
      pointer-events: none;
    }

    .hero-topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #dbe7ff;
      background: rgba(120, 167, 255, 0.13);
      border: 1px solid rgba(120, 167, 255, 0.28);
    }

    .lang-switch {
      display: inline-flex;
      gap: 6px;
      padding: 5px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(13, 20, 48, 0.88);
      backdrop-filter: blur(6px);
    }

    .lang-btn {
      border: 0;
      border-radius: 999px;
      padding: 7px 12px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      transition: background 0.18s ease, color 0.18s ease, transform 0.18s ease;
    }

    .lang-btn:hover {
      color: var(--text);
      transform: translateY(-1px);
    }

    .lang-btn.active {
      background: rgba(120, 167, 255, 0.18);
      color: #eef5ff;
      box-shadow: inset 0 0 0 1px rgba(120, 167, 255, 0.24);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 30px;
      line-height: 1.12;
      letter-spacing: 0.2px;
      max-width: 860px;
      position: relative;
      z-index: 1;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 18px;
      line-height: 1.2;
    }

    p {
      margin: 8px 0;
      color: var(--muted);
      line-height: 1.65;
      position: relative;
      z-index: 1;
    }

    .badge-row,
    .resource-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
      position: relative;
      z-index: 1;
    }

    .badge,
    .resource-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.035);
      color: var(--text);
    }

    .resource-link {
      transition: background 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
    }

    .resource-link:hover {
      border-color: rgba(120, 167, 255, 0.45);
      background: rgba(120, 167, 255, 0.1);
      transform: translateY(-1px);
    }

    .resource-link strong {
      color: #dfe9ff;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      padding: 18px;
    }

    .stat {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
      min-height: 110px;
    }

    .stat .k {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
      line-height: 1.45;
    }

    .stat .v {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.3px;
      line-height: 1.15;
    }

    .stat .sub {
      margin-top: 4px;
      font-size: 12px;
      color: #7f91bd;
    }

    .findings {
      padding: 18px 20px 20px;
    }

    .section-kicker {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: #8fb0ff;
      margin-bottom: 10px;
    }

    .findings-list {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
      line-height: 1.6;
    }

    .findings-list li + li {
      margin-top: 10px;
    }

    .findings-list strong {
      color: #eff4ff;
    }

    .risk-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .risk-pill {
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid rgba(246, 196, 83, 0.2);
      background: rgba(246, 196, 83, 0.06);
      color: #f8e8bb;
      font-size: 12px;
      line-height: 1.5;
    }

    .updates-section {
      margin-bottom: 16px;
      padding: 20px 22px 22px;
    }

    .page-nav {
      position: sticky;
      top: 12px;
      z-index: 12;
      margin-bottom: 16px;
      padding: 12px 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      background: rgba(17, 24, 45, 0.92);
      backdrop-filter: blur(10px);
    }

    .page-nav-link,
    .subnav-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 13px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.032);
      color: #dbe7ff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    }

    .page-nav-link:hover,
    .subnav-link:hover {
      transform: translateY(-1px);
      border-color: rgba(120, 167, 255, 0.42);
      background: rgba(120, 167, 255, 0.1);
    }

    .updates-header {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 18px;
    }

    .updates-header p {
      margin: 0;
      max-width: 1100px;
    }

    .updates-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .update-card {
      border: 1px solid rgba(120, 167, 255, 0.14);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.028);
      padding: 16px 16px 15px;
    }

    .update-index {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: rgba(120, 167, 255, 0.15);
      color: #dbe7ff;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .update-title {
      margin: 0 0 8px;
      font-size: 16px;
      line-height: 1.35;
      color: #eef4ff;
    }

    .update-body,
    .update-note {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .update-note {
      margin-top: 10px;
      color: #d6e1ff;
    }

    .update-points {
      margin: 10px 0 0;
      padding-left: 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
      list-style: disc;
    }

    .update-points li + li {
      margin-top: 8px;
    }

    .company-section {
      margin-bottom: 16px;
      padding: 20px 22px 22px;
    }

    .company-header p {
      margin: 0;
      max-width: 1150px;
    }

    .company-subnav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 16px 0 18px;
    }

    .company-block + .company-block {
      margin-top: 20px;
    }

    .company-block-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .company-block-header p {
      margin: 0;
      font-size: 13px;
    }

    .company-summary-grid,
    .focus-grid,
    .ranking-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .focus-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .summary-card,
    .focus-card,
    .ranking-card,
    .final-callout {
      border: 1px solid rgba(120, 167, 255, 0.14);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.026);
      padding: 16px 16px 15px;
    }

    .summary-card h3,
    .focus-card h3,
    .ranking-card h3 {
      margin: 0 0 8px;
      font-size: 16px;
      line-height: 1.35;
      color: #eef4ff;
    }

    .summary-card p,
    .focus-card p,
    .ranking-card p,
    .final-callout p {
      margin: 0;
      font-size: 13px;
      line-height: 1.7;
    }

    .summary-card ul {
      margin: 10px 0 0;
      padding-left: 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .summary-card li + li {
      margin-top: 8px;
    }

    .section-note {
      margin-top: 12px;
      color: #d6e1ff;
      font-size: 13px;
      line-height: 1.7;
    }

    .company-tablewrap {
      overflow: auto;
      border: 1px solid rgba(120, 167, 255, 0.1);
      border-radius: 18px;
    }

    .company-table {
      min-width: 1180px;
    }

    .company-table th {
      background: #101834;
    }

    .company-name {
      font-weight: 700;
      color: #eef4ff;
    }

    .num {
      white-space: nowrap;
    }

    .matrix-table {
      min-width: 1400px;
    }

    .pill-inline {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 9px;
      border-radius: 999px;
      border: 1px solid rgba(246, 196, 83, 0.22);
      background: rgba(246, 196, 83, 0.08);
      color: #f8e8bb;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 10px;
    }

    .ranking-list {
      margin-top: 10px;
      color: #eef4ff;
      font-weight: 700;
      line-height: 1.6;
    }

    .final-callout {
      margin-top: 20px;
      background:
        radial-gradient(circle at top right, rgba(120, 167, 255, 0.15), transparent 36%),
        rgba(255, 255, 255, 0.03);
    }

    .final-callout h3 {
      margin: 0 0 10px;
      font-size: 18px;
      color: #f4f8ff;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 180px 180px 180px;
      gap: 10px;
      padding: 14px 16px 8px;
    }

    input,
    select {
      background: #0d1430;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
    }

    input::placeholder {
      color: #8190b6;
    }

    .toolbar-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 0 16px 12px;
      flex-wrap: wrap;
    }

    .result-summary {
      color: #dce6ff;
      font-size: 13px;
      font-weight: 600;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      padding: 0 16px 16px;
      color: var(--muted);
      font-size: 13px;
    }

    .legend-filter {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 11px;
      background: rgba(255, 255, 255, 0.035);
      color: var(--text);
      cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease, opacity 0.18s ease, transform 0.18s ease;
    }

    .legend-filter:hover {
      border-color: rgba(120, 167, 255, 0.38);
      transform: translateY(-1px);
    }

    .legend-filter.is-inactive {
      opacity: 0.45;
      background: rgba(255, 255, 255, 0.015);
      color: #8c99bb;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
      vertical-align: middle;
    }

    #map {
      height: 760px;
      width: 100%;
      border-radius: 18px;
    }

    .mapbox {
      padding: 10px;
    }

    .tablewrap {
      margin-top: 16px;
      padding: 10px 12px 16px;
      overflow: auto;
    }

    .table-title {
      padding: 8px 6px 6px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }

    .table-title p {
      margin: 0;
      font-size: 13px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 13px;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 10px 8px;
      vertical-align: top;
      text-align: left;
      word-wrap: break-word;
    }

    th {
      position: sticky;
      top: 0;
      background: #0f1731;
      z-index: 1;
      font-weight: 700;
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.03);
    }

    .empty-state {
      padding: 22px 12px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .cell-sub {
      display: block;
      margin-top: 4px;
      color: #8594ba;
      font-size: 11px;
      line-height: 1.5;
    }

    .table-pill {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.15;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .footnote {
      padding: 14px 18px 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .popup-title {
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 6px;
    }

    .popup-grid {
      display: grid;
      grid-template-columns: 104px 1fr;
      gap: 6px 8px;
      font-size: 12px;
    }

    .popup-label {
      color: #69758f;
      font-size: 11px;
      line-height: 1.45;
    }

    .popup-value-primary {
      color: #1f2937;
      line-height: 1.45;
    }

    .leaflet-popup-content-wrapper {
      border-radius: 14px;
    }

    .leaflet-popup-content {
      margin: 12px 14px;
      line-height: 1.45;
      min-width: 280px;
    }

    .loading-note,
    .error-note {
      padding: 18px 16px 6px;
      color: var(--muted);
      font-size: 14px;
    }

    .error-note {
      color: #ffb4c2;
    }

    @media (max-width: 1180px) {
      .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 980px) {
      .top {
        grid-template-columns: 1fr;
      }

      .toolbar {
        grid-template-columns: 1fr 1fr;
      }

      .risk-grid {
        grid-template-columns: 1fr;
      }

      .updates-grid {
        grid-template-columns: 1fr;
      }

      .company-summary-grid,
      .focus-grid,
      .ranking-grid {
        grid-template-columns: 1fr;
      }

      #map {
        height: 560px;
      }
    }

    @media (max-width: 640px) {
      .wrap {
        width: min(96vw, 100%);
        margin-top: 14px;
      }

      .hero,
      .findings {
        padding-inline: 18px;
      }

      .page-nav {
        top: 8px;
      }

      .hero-topbar,
      .toolbar-meta,
      .table-title {
        flex-direction: column;
        align-items: flex-start;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 26px;
      }

      .leaflet-popup-content {
        min-width: 0;
      }

      .popup-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="wrap" id="app">
    <div class="top">
      <div class="card hero">
        <div class="hero-topbar">
          <div class="eyebrow" id="heroEyebrow">Lithium Research 2026</div>
          <div class="lang-switch" aria-label="Language switch">
            <button class="lang-btn" id="langZhBtn" data-lang="zh" type="button">中文</button>
            <button class="lang-btn" id="langEnBtn" data-lang="en" type="button">EN</button>
          </div>
        </div>
        <h1 id="heroTitle">全球锂资源项目地图与数据库（2026）</h1>
        <p id="heroIntro1"></p>
        <p id="heroIntro2"></p>
        <div class="badge-row" id="heroBadges"></div>
        <div class="resource-links">
          <a class="resource-link" href="/data/global-lithium-database-2026.csv" download id="resourceCsvLink"></a>
          <a class="resource-link" href="/data/global-lithium-key-findings-2026.md" download id="resourceMdLink"></a>
        </div>
      </div>

      <div class="side-stack">
        <div class="card stats">
          <div class="stat">
            <div class="k" id="statProjectLabel"></div>
            <div class="v" id="statProjectCount">--</div>
          </div>
          <div class="stat">
            <div class="k" id="statCountryLabel"></div>
            <div class="v" id="statCountryCount">--</div>
          </div>
          <div class="stat">
            <div class="k" id="statOperatingLabel"></div>
            <div class="v" id="statOperatingCount">--</div>
          </div>
          <div class="stat">
            <div class="k" id="statCurrentCapacityLabel"></div>
            <div class="v" id="statCurrentCapacity">--</div>
            <div class="sub" id="statCurrentCapacityUnit"></div>
          </div>
          <div class="stat">
            <div class="k" id="statPlannedCapacityLabel"></div>
            <div class="v" id="statPlannedCapacity">--</div>
            <div class="sub" id="statPlannedCapacityUnit"></div>
          </div>
          <div class="stat">
            <div class="k" id="statPipelineLabel"></div>
            <div class="v" id="statPipelineCount">--</div>
          </div>
        </div>

        <div class="card findings">
          <div class="section-kicker" id="findingsKicker"></div>
          <ol class="findings-list" id="findingsList"></ol>
          <div class="section-kicker" id="riskKicker" style="margin-top:18px;"></div>
          <div class="risk-grid" id="riskGrid"></div>
        </div>
      </div>
    </div>

    <nav class="card page-nav" id="pageNav"></nav>

    <section class="card updates-section" id="researchUpdatesSection">
      <div class="updates-header">
        <div class="section-kicker" id="updatesKicker"></div>
        <h2 id="updatesTitle"></h2>
        <p id="updatesSubtitle"></p>
      </div>
      <div class="updates-grid" id="updatesGrid"></div>
    </section>

    <section class="card company-section" id="companyResearchSection">
      <div class="company-header">
        <div class="section-kicker" id="companyKicker"></div>
        <h2 id="companyTitle"></h2>
        <p id="companySubtitle"></p>
      </div>
      <div class="company-subnav" id="companySubnav"></div>

      <div class="company-block" id="quickTakeSection">
        <div class="company-block-header">
          <h2 id="quickTakeTitle"></h2>
          <p id="quickTakeSubtitle"></p>
        </div>
        <div class="company-summary-grid" id="quickTakeGrid"></div>
        <div class="section-note" id="quickTakeNote"></div>
      </div>

      <div class="company-block" id="domesticEquitiesSection">
        <div class="company-block-header">
          <h2 id="domesticTitle"></h2>
          <p id="domesticSubtitle"></p>

    function escapeHtml(value) {
      if (value === null || value === undefined || value === '') {
        return '—';
      }

      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function escapeRegExp(value) {
      return value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function normalizeCompanyKey(value) {
      return String(value || '')
        .normalize('NFKC')
        .trim()
        .toLowerCase()
        .replace(/[^\p{L}\p{N}]+/gu, '');
    }

    function formatMetric(value) {
      if (!Number.isFinite(value)) {
        return '—';
      }

      return value.toLocaleString('en-US', {
        minimumFractionDigits: 1,
        maximumFractionDigits: 1,
      });
    }

    function formatCount(value) {
      return Number.isFinite(value) ? value.toLocaleString('en-US') : '—';
    }

    function hexToRgba(hex, alpha) {
      const normalized = String(hex || '').replace('#', '');
      if (!/^[0-9a-fA-F]{6}$/.test(normalized)) {
        return `rgba(148, 163, 184, ${alpha})`;
      }

      const r = Number.parseInt(normalized.slice(0, 2), 16);
      const g = Number.parseInt(normalized.slice(2, 4), 16);
      const b = Number.parseInt(normalized.slice(4, 6), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let cell = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i += 1) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (inQuotes && nextChar === '"') {
            cell += '"';
            i += 1;
          } else {
            inQuotes = !inQuotes;
          }
          continue;
        }

        if (char === ',' && !inQuotes) {
          row.push(cell);
          cell = '';
          continue;
        }

        if ((char === '\n' || char === '\r') && !inQuotes) {
          if (char === '\r' && nextChar === '\n') {
            i += 1;
          }
          row.push(cell);
          if (row.some((value) => value !== '')) {
            rows.push(row);
          }
          row = [];
          cell = '';
          continue;
        }

        cell += char;
      }

      if (cell !== '' || row.length) {
        row.push(cell);
        if (row.some((value) => value !== '')) {
          rows.push(row);
        }
      }

      return rows;
    }

    function normalizeStatusGroup(status) {
      const s = String(status || '').toLowerCase();
      if (s.includes('care') || s.includes('hold') || s.includes('stalled')) return 'On hold / stalled';
      if (s.includes('ramp')) return 'Ramp-up';
      if (s.includes('construction') || s.includes('commission')) return 'Construction';
      if (
        s.includes('development') ||
        s.includes('permitted') ||
        s.includes('dfs') ||
        s.includes('pre-construction')
      ) {
        return 'Development';
      }
      if (s.includes('cluster')) return 'Cluster';
      if (s.includes('operating')) return 'Operating';
      return 'Other';
    }

    function toNumber(value) {
      if (value === null || value === undefined || value === '') {
        return null;
      }

      const num = Number(value);
      return Number.isFinite(num) ? num : null;
    }

    function loadCsvData(text) {
      const rows = parseCsv(text.replace(/^\uFEFF/, ''));
      const [headers, ...values] = rows;

      return values.map((cols) => {
        const item = {};

        headers.forEach((header, index) => {
          const key = header.replace(/^\uFEFF/, '').trim();
          const value = cols[index] ?? '';
          item[key] = numericFields.has(key) ? toNumber(value) : value;
        });

        item.status_group = normalizeStatusGroup(item.status);
        item.map_capacity_kta = Math.max(
          Number(item.current_kta_lce || 0),
          Number(item.planned_kta_lce || 0),
          Number(item.map_capacity_kta || 0)
        );

        return item;
      });
    }

      if (field === 'project') {
        return dictionaries.project[value] || String(value);
      }

      return translateNarrativeToZh(value, field);
    }

      countryDefault.value = 'all';
      countryDefault.textContent = t.allCountries;
      countryFilter.appendChild(countryDefault);

      for (const value of uniqueVals('status_group')) {
        const opt = document.createElement('option');
        opt.value = value;
        opt.textContent = localizeValue(value, 'status_group', currentLang);
        statusFilter.appendChild(opt);
      }

      for (const value of uniqueVals('country')) {
        const opt = document.createElement('option');
        opt.value = value;
        opt.textContent = localizeValue(value, 'country', currentLang);
        countryFilter.appendChild(opt);
      }

      for (const [value, label] of Object.entries(t.sortOptions)) {
        const opt = document.createElement('option');
        opt.value = value;
        opt.textContent = label;
        sortFilter.appendChild(opt);
      }

      statusFilter.value = selectedStatus;
      countryFilter.value = selectedCountry;
      sortFilter.value = selectedSort;
    }

    function renderLegend() {
      const t = locales[currentLang];
      legend.innerHTML = statusLegendItems
        .map(
          (key) =>
            `<button class="legend-filter ${activeStatusGroups.has(key) ? '' : 'is-inactive'}" data-status-group="${escapeHtml(key)}" type="button"><span class="dot" style="background:${colorMap[key]}"></span>${escapeHtml(t.legend[key])}</button>`
        )
        .join('');
    }

    function renderJumpLinks(container, links) {
      container.innerHTML = links
        .map(
          (item) =>
            `<a class="${container === pageNav ? 'page-nav-link' : 'subnav-link'}" href="${escapeHtml(item.href)}">${escapeHtml(item.label)}</a>`
        )
        .join('');
    }

    function renderMetricsTable(headEl, bodyEl, headers, rows) {
      headEl.innerHTML = headers.map((label) => `<th>${escapeHtml(label)}</th>`).join('');
      bodyEl.innerHTML = rows
        .map((row) => {
          const [name, ...rest] = row;
          const metrics = rest.slice(0, 8)
            .map((value) => `<td class="num">${escapeHtml(value)}</td>`)
            .join('');
          const note = rest[8];
          return `
            <tr>
              <td class="company-name">${escapeHtml(name)}</td>
              ${metrics}
              <td>${escapeHtml(note)}</td>
            </tr>
          `;
        })
        .join('');
    }

    function createCompanyFinanceIndex(records) {
      const index = new Map();

      records
        .filter(
          (record) =>
            record.reportSlugs?.includes('2026-04-global-lithium') &&
            record.finance?.datasetKind === 'annual'
        )
        .forEach((record) => {
          [record.companyName, ...(record.aliases || [])].forEach((name) => {
            const normalized = normalizeCompanyKey(name);

            if (normalized) {
              index.set(normalized, record);
            }
          });
        });

      return index;
    }

    function getCompanyFinanceRecord(companyName) {
      return companyFinanceIndex.get(normalizeCompanyKey(companyName)) || null;
    }

    async function loadCompanyFinancials() {
      const response = await fetch(COMPANY_FINANCIALS_URL);

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      const text = await response.text();
      const records = text
        .split('\n')
        .map((line) => line.trim())
        .filter(Boolean)
        .map((line) => JSON.parse(line));

      companyFinanceIndex = createCompanyFinanceIndex(records);
    }

    function buildFinanceTableRows(baseRows) {
      return baseRows.map((row) => {
        const [companyName, , , , , , , , , fallbackNote] = row;
        const record = getCompanyFinanceRecord(companyName);

        if (!record?.finance) {
          return row;
        }

        const netProfit = record.finance.display?.netProfit || ['待补', '待补', '待补', '待补'];
        const forwardPE = record.finance.display?.forwardPE || ['待补', '待补', '待补', '待补'];
        const note = record.finance.notes?.[currentLang] || fallbackNote || record.finance.note || '—';

        return [
          companyName,
          netProfit[0] || '待补',
          netProfit[1] || '待补',
          netProfit[2] || '待补',
          netProfit[3] || '待补',
          forwardPE[0] || '待补',
          forwardPE[1] || '待补',
          forwardPE[2] || '待补',
          forwardPE[3] || '待补',
          note,
        ];
      });
    }

    function renderMatrixTable(headEl, bodyEl, headers, rows) {
      headEl.innerHTML = headers.map((label) => `<th>${escapeHtml(label)}</th>`).join('');
      bodyEl.innerHTML = rows
        .map(
          (row) => `
            <tr>
              ${row.map((value, index) => `<td${index === 0 ? ' class="company-name"' : ''}>${escapeHtml(value)}</td>`).join('')}
            </tr>
          `
        )
        .join('');
    }

    function renderCompanyResearch() {
      const t = companyResearchContent[currentLang];

      renderJumpLinks(pageNav, t.pageNav);
      renderJumpLinks(companySubnav, t.subnav);

      document.getElementById('companyKicker').textContent = t.companyKicker;
      document.getElementById('companyTitle').textContent = t.companyTitle;
      document.getElementById('companySubtitle').textContent = t.companySubtitle;
      document.getElementById('quickTakeTitle').textContent = t.quickTakeTitle;
      document.getElementById('quickTakeSubtitle').textContent = t.quickTakeSubtitle;
      document.getElementById('quickTakeNote').textContent = t.quickTakeNote;
      document.getElementById('domesticTitle').textContent = t.domesticTitle;
      document.getElementById('domesticSubtitle').textContent = t.domesticSubtitle;
      document.getElementById('domesticNote').textContent = t.domesticNote;
      document.getElementById('globalTitle').textContent = t.globalTitle;
      document.getElementById('globalSubtitle').textContent = t.globalSubtitle;
      document.getElementById('globalNote').textContent = t.globalNote;
      document.getElementById('matrixTitle').textContent = t.matrixTitle;
      document.getElementById('matrixSubtitle').textContent = t.matrixSubtitle;
      document.getElementById('focusTitle').textContent = t.focusTitle;
      document.getElementById('focusSubtitle').textContent = t.focusSubtitle;
      document.getElementById('rankingTitle').textContent = t.rankingTitle;
      document.getElementById('rankingSubtitle').textContent = t.rankingSubtitle;
      document.getElementById('finalCallTitle').textContent = t.finalCallTitle;
      document.getElementById('finalCallBody').textContent = t.finalCallBody;

      quickTakeGrid.innerHTML = t.quickTakeCards
        .map(
          (item) => `
            <article class="summary-card">
              <div class="pill-inline">${escapeHtml(item.pill)}</div>
              <h3>${escapeHtml(item.title)}</h3>
              <p>${escapeHtml(item.body)}</p>
              <ul>${item.bullets.map((bullet) => `<li>${escapeHtml(bullet)}</li>`).join('')}</ul>
            </article>
          `
        )
        .join('');

      renderMetricsTable(domesticTableHead, domesticTableBody, t.tableHeaders, buildFinanceTableRows(t.domesticRows));
      renderMetricsTable(globalTableHead, globalTableBody, t.tableHeaders, buildFinanceTableRows(t.globalRows));
      renderMatrixTable(matrixTableHead, matrixTableBody, t.matrixHeaders, t.matrixRows);

      focusGrid.innerHTML = t.focusCards
        .map(
          (item) => `
            <article class="focus-card">
              <h3>${escapeHtml(item.title)}</h3>
              <p>${escapeHtml(item.body)}</p>
            </article>
          `
        )
        .join('');

      rankingGrid.innerHTML = t.rankingCards
        .map(
          (item) => `
            <article class="ranking-card">
              <div class="pill-inline">${escapeHtml(item.pill)}</div>
              <h3>${escapeHtml(item.title)}</h3>
              <div class="ranking-list">${escapeHtml(item.companies)}</div>
              <p>${escapeHtml(item.body)}</p>
            </article>
          `
        )
        .join('');
    }

    function renderStaticText() {
      const t = locales[currentLang];

      document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'en';
      document.title = t.title;
      langZhBtn.classList.toggle('active', currentLang === 'zh');
      langEnBtn.classList.toggle('active', currentLang === 'en');

      document.getElementById('heroEyebrow').textContent = t.eyebrow;
      document.getElementById('heroTitle').textContent = t.title;
      document.getElementById('heroIntro1').innerHTML = t.heroIntro1;
      document.getElementById('heroIntro2').innerHTML = t.heroIntro2;
      document.getElementById('resourceCsvLink').innerHTML = t.resourceCsv;
      document.getElementById('resourceMdLink').innerHTML = t.resourceMd;

      document.getElementById('statProjectLabel').textContent = t.stats.project;
      document.getElementById('statCountryLabel').textContent = t.stats.country;
      document.getElementById('statOperatingLabel').textContent = t.stats.operating;
      document.getElementById('statCurrentCapacityLabel').textContent = t.stats.currentCapacity;
      document.getElementById('statPlannedCapacityLabel').textContent = t.stats.plannedCapacity;
      document.getElementById('statPipelineLabel').textContent = t.stats.pipeline;
      document.getElementById('statCurrentCapacityUnit').textContent = t.stats.unit;
      document.getElementById('statPlannedCapacityUnit').textContent = t.stats.unit;

      document.getElementById('findingsKicker').textContent = t.findingsKicker;
      findingsList.innerHTML = t.findings.map((item) => `<li>${item}</li>`).join('');
      document.getElementById('riskKicker').textContent = t.riskKicker;
      riskGrid.innerHTML = t.risks.map((item) => `<div class="risk-pill">${escapeHtml(item)}</div>`).join('');
      document.getElementById('updatesKicker').textContent = t.updatesKicker;
      document.getElementById('updatesTitle').textContent = t.updatesTitle;
      document.getElementById('updatesSubtitle').textContent = t.updatesSubtitle;
      updatesGrid.innerHTML = t.researchUpdates
        .map(
          (item, index) => `
            <article class="update-card">
              <div class="update-index">${index + 1}</div>
              <h3 class="update-title">${escapeHtml(item.title)}</h3>
              <p class="update-body">${escapeHtml(item.body)}</p>
              ${
                item.bullets?.length
                  ? `<ul class="update-points">${item.bullets
                      .map((bullet) => `<li>${escapeHtml(bullet)}</li>`)
                      .join('')}</ul>`
                  : ''
              }
              ${item.note ? `<p class="update-note">${escapeHtml(item.note)}</p>` : ''}
            </article>
          `
        )
        .join('');

      searchBox.placeholder = t.searchPlaceholder;
      document.getElementById('tableTitle').textContent = t.tableTitle;
      document.getElementById('tableSubtitle').textContent = t.tableSubtitle;
      footnoteEl.innerHTML = t.footnote;
      loadingNote.textContent = t.loading;

      dataTableHead.innerHTML = t.tableHeaders
        .map((label, index) => {
          const widths = ['150px', '110px', '210px', '130px', '120px', '220px', '100px', '84px', '84px', '210px', '190px', '200px', '240px', '190px'];
          return `<th style="width:${widths[index]};">${escapeHtml(label)}</th>`;
        })
        .join('');

      renderLegend();
      renderFilters();
      renderCompanyResearch();
    }

    function renderHeroBadges(data) {
      const t = locales[currentLang];
      const projectCount = data.length;
      const countryCount = new Set(data.map((d) => d.country)).size;

      heroBadges.innerHTML = [
        currentLang === 'zh'
          ? `<span class="badge"><strong>${formatCount(projectCount)}</strong> 个项目/集群</span>`
          : `<span class="badge"><strong>${formatCount(projectCount)}</strong> projects / clusters</span>`,
        currentLang === 'zh'
          ? `<span class="badge"><strong>${formatCount(countryCount)}</strong> 个国家</span>`
          : `<span class="badge"><strong>${formatCount(countryCount)}</strong> countries</span>`,
        `<span class="badge">${escapeHtml(t.badgeProfessional)}</span>`,
        `<span class="badge">${escapeHtml(t.badgeFilter)}</span>`,
      ].join('');
    }

    function updateStats(data) {
      const projectCount = data.length;
      const countryCount = new Set(data.map((d) => d.country)).size;
      const operatingCount = data.filter((d) => d.status_group === 'Operating').length;
      const pipelineCount = data.filter(
        (d) => d.status_group === 'Construction' || d.status_group === 'Development'
      ).length;
      const currentCapacity = data.reduce((sum, d) => sum + Number(d.current_kta_lce || 0), 0);
      const plannedCapacity = data.reduce((sum, d) => sum + Number(d.planned_kta_lce || 0), 0);

      document.getElementById('statProjectCount').textContent = formatCount(projectCount);
      document.getElementById('statCountryCount').textContent = formatCount(countryCount);
      document.getElementById('statOperatingCount').textContent = formatCount(operatingCount);
      document.getElementById('statPipelineCount').textContent = formatCount(pipelineCount);
      document.getElementById('statCurrentCapacity').textContent = formatMetric(currentCapacity);
      document.getElementById('statPlannedCapacity').textContent = formatMetric(plannedCapacity);

      renderHeroBadges(data);
    }

    function radius(capacity) {
      return 4 + Math.sqrt(Math.max(Number(capacity || 0), 0)) * 1.25;
    }

    function popupLabel(key) {
      return escapeHtml(locales[currentLang].popupLabels[key]);
    }

    function popupValueMarkup(value, field, suffix = '') {
      const primary = localizeValue(value, field, currentLang);
      const primaryText = suffix && primary !== '—' ? `${primary}${suffix}` : primary;

      return `
        <div class="popup-value-primary">${escapeHtml(primaryText)}</div>
      `;
    }

    function popupValueMarkupFromTexts(primaryText) {
      return `
        <div class="popup-value-primary">${escapeHtml(primaryText)}</div>
      `;
    }

    function popupHtml(item) {
      const titlePrimary = localizeValue(item.project, 'project', currentLang);
      const countryPrimary = `${localizeValue(item.country, 'country', currentLang)} / ${localizeValue(item.region, 'region', currentLang)}`;

      return `
        <div class="popup-title">
          ${escapeHtml(titlePrimary)}
        </div>
        <div class="popup-grid">
          <div class="popup-label">${popupLabel('country')}</div><div>${popupValueMarkupFromTexts(countryPrimary)}</div>
          <div class="popup-label">${popupLabel('status')}</div><div>${popupValueMarkup(item.status, 'status')}</div>
          <div class="popup-label">${popupLabel('type')}</div><div>${popupValueMarkup(item.deposit_type, 'deposit_type')}</div>
          <div class="popup-label">${popupLabel('reserve')}</div><div>${popupValueMarkup(item.reserve_resource, 'reserve_resource')}</div>
          <div class="popup-label">${popupLabel('grade')}</div><div>${popupValueMarkup(item.grade, 'grade')}</div>
          <div class="popup-label">${popupLabel('current')}</div><div>${popupValueMarkup(item.current_kta_lce, 'plain', currentLang === 'zh' ? ' kt LCE/年' : ' kt LCE/year')}</div>
          <div class="popup-label">${popupLabel('planned')}</div><div>${popupValueMarkup(item.planned_kta_lce, 'plain', currentLang === 'zh' ? ' kt LCE/年' : ' kt LCE/year')}</div>
          <div class="popup-label">${popupLabel('cost')}</div><div>${popupValueMarkup(item.cost, 'cost')}</div>
          <div class="popup-label">${popupLabel('address')}</div><div>${popupValueMarkup(item.address, 'address')}</div>
          <div class="popup-label">${popupLabel('route')}</div><div>${popupValueMarkup(item.route, 'route')}</div>
          <div class="popup-label">${popupLabel('risks')}</div><div>${popupValueMarkup(item.risks, 'risks')}</div>
          <div class="popup-label">${popupLabel('source')}</div><div>${popupValueMarkup(item.source_note, 'source_note')}</div>
        </div>
      `;
    }

    function sortData(data) {
      const sortValue = sortFilter.value;
      const arr = [...data];

      if (sortValue === 'capacity_desc') {
        arr.sort((a, b) => b.map_capacity_kta - a.map_capacity_kta);
      } else if (sortValue === 'capacity_asc') {
        arr.sort((a, b) => a.map_capacity_kta - b.map_capacity_kta);
      } else if (sortValue === 'name_asc') {
        arr.sort((a, b) => a.project.localeCompare(b.project, 'en'));
      } else if (sortValue === 'country_asc') {
        arr.sort((a, b) => `${a.country}${a.project}`.localeCompare(`${b.country}${b.project}`, 'en'));
      }

      return arr;
    }

    function buildSearchHaystack(item) {
      const values = [
        item.project,
        localizeValue(item.project, 'project', 'zh'),
        item.country,
        localizeValue(item.country, 'country', 'zh'),
        item.region,
        localizeValue(item.region, 'region', 'zh'),
        item.status,
        localizeValue(item.status, 'status', 'zh'),
        item.deposit_type,
        localizeValue(item.deposit_type, 'deposit_type', 'zh'),
        item.reserve_resource,
        localizeValue(item.reserve_resource, 'reserve_resource', 'zh'),
        item.grade,
        localizeValue(item.grade, 'grade', 'zh'),
        item.cost,
        localizeValue(item.cost, 'cost', 'zh'),
        item.address,
        localizeValue(item.address, 'address', 'zh'),
        item.route,
        localizeValue(item.route, 'route', 'zh'),
        item.risks,
        localizeValue(item.risks, 'risks', 'zh'),
        item.source_note,
        localizeValue(item.source_note, 'source_note', 'zh'),
        listedOwnerLabel(item.project, 'zh'),
        listedOwnerLabel(item.project, 'en'),
      ];

      return values.join(' ').toLowerCase();
    }

    function filteredData() {
      const query = searchBox.value.trim().toLowerCase();
      const selectedStatus = statusFilter.value;
      const selectedCountry = countryFilter.value;

      return rawData.filter((item) => {
        const passLegend = activeStatusGroups.has(item.status_group);
        const passStatus = selectedStatus === 'all' || item.status_group === selectedStatus;
        const passCountry = selectedCountry === 'all' || item.country === selectedCountry;
        const haystack = buildSearchHaystack(item);
        const passSearch = !query || haystack.includes(query);
        return passLegend && passStatus && passCountry && passSearch;
      });
    }

    function renderTable(data) {
      const t = locales[currentLang];
      tbody.innerHTML = '';

      if (!data.length) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td colspan="14" class="empty-state">${escapeHtml(t.emptyState)}</td>`;
        tbody.appendChild(tr);
        return;
      }

      for (const item of data) {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${escapeHtml(localizeValue(item.project, 'project', currentLang))}</td>
          <td>${renderCountryPill(item.country)}</td>
          <td>${escapeHtml(listedOwnerLabel(item.project, currentLang))}</td>
          <td>${renderStatusPill(item)}</td>
          <td>${escapeHtml(localizeValue(item.deposit_type, 'deposit_type', currentLang))}</td>
          <td>${escapeHtml(localizeValue(item.reserve_resource, 'reserve_resource', currentLang))}</td>
          <td>${escapeHtml(localizeValue(item.grade, 'grade', currentLang))}</td>
          <td>${escapeHtml(item.current_kta_lce)}</td>
          <td>${escapeHtml(item.planned_kta_lce)}</td>
          <td>${escapeHtml(localizeValue(item.cost, 'cost', currentLang))}</td>
          <td>${escapeHtml(localizeValue(item.address, 'address', currentLang))}</td>
          <td>${escapeHtml(localizeValue(item.route, 'route', currentLang))}</td>
          <td>${escapeHtml(localizeValue(item.risks, 'risks', currentLang))}</td>
          <td>${escapeHtml(localizeValue(item.source_note, 'source_note', currentLang))}</td>
        `;
        tbody.appendChild(tr);
      }
    }

    function renderMap(data) {
      markerLayer.clearLayers();
      lineLayer.clearLayers();

      for (const item of data) {
        if (!Number.isFinite(item.lat) || !Number.isFinite(item.lon)) {
          continue;
        }

        const color = colorMap[item.status_group] || '#94a3b8';
        const markerRadius = radius(item.map_capacity_kta);
        const marker = L.circleMarker([item.lat, item.lon], {
          radius: markerRadius,
          color,
          weight: 1.2,
          fillColor: color,
          fillOpacity: 0.65,
        }).bindPopup(popupHtml(item));

        marker.addTo(markerLayer);

        if (Number.isFinite(item.port_lat) && Number.isFinite(item.port_lon)) {
          const line = L.polyline(
            [
              [item.lat, item.lon],
              [item.port_lat, item.port_lon],
            ],
            {
              color,
              weight: Math.max(1, Math.min(5, markerRadius / 4)),
              opacity: 0.35,
              dashArray: '5,6',
            }
          );
          line.addTo(lineLayer);
        }
      }
    }

    function rerender() {
      const data = sortData(filteredData());
      renderTable(data);
      renderMap(data);
      resultSummary.textContent = locales[currentLang].resultSummary(data.length, rawData.length);
      loadingNote.hidden = true;
      notifyParentHeight();
    }

    function applyLanguage(nextLang) {
      currentLang = nextLang;
      window.localStorage.setItem(LANG_STORAGE_KEY, currentLang);
      renderStaticText();

      if (rawData.length) {
        updateStats(rawData);
        rerender();
      } else if (lastErrorMessage) {
        errorNote.textContent = `${locales[currentLang].errorPrefix}${lastErrorMessage}`;
      }

      notifyParentHeight();
    }

    async function init() {
      try {
        await loadCompanyFinancials();
      } catch (error) {
        console.error('Failed to load shared company financials', error);
        companyFinanceIndex = new Map();
      }

      renderStaticText();

      try {
        const response = await fetch(DATA_URL);
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const text = await response.text();
        rawData = loadCsvData(text);
        updateStats(rawData);
        rerender();

        errorNote.hidden = true;
        window.setTimeout(() => {
          map.invalidateSize();
          notifyParentHeight();
        }, 120);
      } catch (error) {
        lastErrorMessage = error.message;
        loadingNote.hidden = true;
        errorNote.hidden = false;
        errorNote.textContent = `${locales[currentLang].errorPrefix}${lastErrorMessage}`;
        resultSummary.textContent = '';
        notifyParentHeight();
      }
    }

    [searchBox, statusFilter, countryFilter, sortFilter].forEach((element) => {
      element.addEventListener('input', rerender);
      element.addEventListener('change', rerender);
    });

    legend.addEventListener('click', (event) => {
      const button = event.target.closest('.legend-filter');
      if (!button) {
        return;
      }

      const statusGroup = button.dataset.statusGroup;
      if (!statusGroup) {
        return;
      }

      if (activeStatusGroups.has(statusGroup)) {
        activeStatusGroups.delete(statusGroup);
      } else {
        activeStatusGroups.add(statusGroup);
      }

      renderLegend();
      rerender();
    });

    [langZhBtn, langEnBtn].forEach((button) => {
      button.addEventListener('click', () => applyLanguage(button.dataset.lang));
    });

    init();
  </script>
