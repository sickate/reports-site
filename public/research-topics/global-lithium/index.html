<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>全球锂资源项目地图与数据库（2026）</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    :root {
      --bg: #0b1020;
      --panel: #11182d;
      --panel2: #17203a;
      --text: #eef3ff;
      --muted: #a8b2cc;
      --line: #2a365d;
      --accent: #78a7ff;
      --green: #4ade80;
      --orange: #f59e0b;
      --purple: #a78bfa;
      --red: #fb7185;
      --gray: #94a3b8;
      --cyan: #22d3ee;
      --gold: #f6c453;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    html,
    body {
      margin: 0;
      padding: 0;
      scroll-behavior: smooth;
      background:
        radial-gradient(circle at top left, rgba(120, 167, 255, 0.14), transparent 30%),
        radial-gradient(circle at top right, rgba(246, 196, 83, 0.09), transparent 24%),
        var(--bg);
      color: var(--text);
      font-family: "IBM Plex Sans", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .wrap {
      width: min(1600px, 96vw);
      margin: 18px auto 28px;
    }

    /* The hero used to sit in a two-column grid beside the KPI + findings stack, which
       is what stretched it to the height of its neighbour and left the large blank the
       review flagged. It is now a full-width header and the cockpit stacks below it. */
    .page-header {
      display: block;
      margin-bottom: 16px;
    }

    .side-stack {
      display: grid;
      gap: 16px;
    }

    .card {
      background: linear-gradient(180deg, rgba(17, 24, 45, 0.96), rgba(23, 32, 58, 0.96));
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }

    .card[id],
    .company-block {
      scroll-margin-top: 86px;
    }

    .hero {
      padding: 24px 26px;
      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: auto -12% -45% auto;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(120, 167, 255, 0.22), transparent 65%);
      pointer-events: none;
    }

    .hero-topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #dbe7ff;
      background: rgba(120, 167, 255, 0.13);
      border: 1px solid rgba(120, 167, 255, 0.28);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 30px;
      line-height: 1.12;
      letter-spacing: 0.2px;
      max-width: 860px;
      position: relative;
      z-index: 1;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 18px;
      line-height: 1.2;
    }

    p {
      margin: 8px 0;
      color: var(--muted);
      line-height: 1.65;
      position: relative;
      z-index: 1;
    }

    .badge-row,
    .resource-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
      position: relative;
      z-index: 1;
    }

    .badge,
    .resource-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.035);
      color: var(--text);
    }

    .resource-link {
      transition: background 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
    }

    .resource-link:hover {
      border-color: rgba(120, 167, 255, 0.45);
      background: rgba(120, 167, 255, 0.1);
      transform: translateY(-1px);
    }

    .resource-link strong {
      color: #dfe9ff;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 12px;
      padding: 18px;
    }

    .stat {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
      min-height: 110px;
    }

    .stat .k {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
      line-height: 1.45;
    }

    .stat .v {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.3px;
      line-height: 1.15;
    }

    .stat .sub {
      margin-top: 4px;
      font-size: 12px;
      color: #7f91bd;
    }

    .findings {
      padding: 18px 20px 20px;
    }

    .section-kicker {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: #8fb0ff;
      margin-bottom: 10px;
    }

    .findings-list {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
      line-height: 1.6;
    }

    .findings-list li + li {
      margin-top: 10px;
    }

    .findings-list strong {
      color: #eff4ff;
    }

    .risk-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .risk-pill {
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid rgba(246, 196, 83, 0.2);
      background: rgba(246, 196, 83, 0.06);
      color: #f8e8bb;
      font-size: 12px;
      line-height: 1.5;
    }

    .updates-section {
      margin-bottom: 16px;
      padding: 20px 22px 22px;
    }

    .page-nav {
      position: sticky;
      top: 12px;
      z-index: 12;
      margin-bottom: 16px;
      padding: 12px 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      background: rgba(17, 24, 45, 0.92);
      backdrop-filter: blur(10px);
    }

    .page-nav-link,
    .subnav-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 13px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.032);
      color: #dbe7ff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    }

    .page-nav-link:hover,
    .subnav-link:hover {
      transform: translateY(-1px);
      border-color: rgba(120, 167, 255, 0.42);
      background: rgba(120, 167, 255, 0.1);
    }

    .updates-header {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 18px;
    }

    .updates-header p {
      margin: 0;
      max-width: 1100px;
    }

    .updates-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .update-card {
      border: 1px solid rgba(120, 167, 255, 0.14);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.028);
      padding: 16px 16px 15px;
    }

    .update-index {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: rgba(120, 167, 255, 0.15);
      color: #dbe7ff;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .update-title {
      margin: 0 0 8px;
      font-size: 16px;
      line-height: 1.35;
      color: #eef4ff;
    }

    .update-body,
    .update-note {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .update-note {
      margin-top: 10px;
      color: #d6e1ff;
    }

    .update-points {
      margin: 10px 0 0;
      padding-left: 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
      list-style: disc;
    }

    .update-points li + li {
      margin-top: 8px;
    }

    .company-section {
      margin-bottom: 16px;
      padding: 20px 22px 22px;
    }

    .company-header p {
      margin: 0;
      max-width: 1150px;
    }

    .company-subnav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 16px 0 18px;
    }

    .company-block + .company-block {
      margin-top: 20px;
    }

    .company-block-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .company-block-header p {
      margin: 0;
      font-size: 13px;
    }

    .company-summary-grid,
    .focus-grid,
    .ranking-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .focus-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .summary-card,
    .focus-card,
    .ranking-card,
    .final-callout {
      border: 1px solid rgba(120, 167, 255, 0.14);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.026);
      padding: 16px 16px 15px;
    }

    .summary-card h3,
    .focus-card h3,
    .ranking-card h3 {
      margin: 0 0 8px;
      font-size: 16px;
      line-height: 1.35;
      color: #eef4ff;
    }

    .summary-card p,
    .focus-card p,
    .ranking-card p,
    .final-callout p {
      margin: 0;
      font-size: 13px;
      line-height: 1.7;
    }

    .summary-card ul {
      margin: 10px 0 0;
      padding-left: 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .summary-card li + li {
      margin-top: 8px;
    }

    .section-note {
      margin-top: 12px;
      color: #d6e1ff;
      font-size: 13px;
      line-height: 1.7;
    }

    .company-tablewrap {
      overflow: auto;
      border: 1px solid rgba(120, 167, 255, 0.1);
      border-radius: 18px;
    }

    .company-table {
      min-width: 1180px;
    }

    .company-table th {
      background: #101834;
    }

    .company-name {
      font-weight: 700;
      color: #eef4ff;
    }

    .num {
      white-space: nowrap;
    }

    .matrix-table {
      min-width: 1400px;
    }

    .pill-inline {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 9px;
      border-radius: 999px;
      border: 1px solid rgba(246, 196, 83, 0.22);
      background: rgba(246, 196, 83, 0.08);
      color: #f8e8bb;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 10px;
    }

    .ranking-list {
      margin-top: 10px;
      color: #eef4ff;
      font-weight: 700;
      line-height: 1.6;
    }

    .final-callout {
      margin-top: 20px;
      background:
        radial-gradient(circle at top right, rgba(120, 167, 255, 0.15), transparent 36%),
        rgba(255, 255, 255, 0.03);
    }

    .final-callout h3 {
      margin: 0 0 10px;
      font-size: 18px;
      color: #f4f8ff;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 170px 170px 150px 170px;
      gap: 10px;
      padding: 14px 16px 8px;
    }

    input,
    select {
      background: #0d1430;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
    }

    input::placeholder {
      color: #8190b6;
    }

    .toolbar-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 0 16px 12px;
      flex-wrap: wrap;
    }

    .result-summary {
      color: #dce6ff;
      font-size: 13px;
      font-weight: 600;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      padding: 0 16px 16px;
      color: var(--muted);
      font-size: 13px;
    }

    .legend-filter {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 11px;
      background: rgba(255, 255, 255, 0.035);
      color: var(--text);
      cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease, opacity 0.18s ease, transform 0.18s ease;
    }

    .legend-filter:hover {
      border-color: rgba(120, 167, 255, 0.38);
      transform: translateY(-1px);
    }

    .legend-filter.is-inactive {
      opacity: 0.45;
      background: rgba(255, 255, 255, 0.015);
      color: #8c99bb;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
      vertical-align: middle;
    }

    #map {
      height: 760px;
      width: 100%;
      border-radius: 18px;
    }

    .mapbox {
      padding: 10px;
    }

    .tablewrap {
      margin-top: 16px;
      padding: 10px 12px 16px;
      overflow: auto;
    }

    /* Hidden by default (the full 14-column table fits on desktop); the mobile media
       query below turns it on. Declared HERE, before that query, so the cascade order
       lets the media rule win — a later top-level rule would silently override it. */
    .table-scroll-hint {
      display: none;
      padding: 0 6px 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .table-title {
      padding: 8px 6px 6px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }

    .table-title p {
      margin: 0;
      font-size: 13px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 13px;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 10px 8px;
      vertical-align: top;
      text-align: left;
      word-wrap: break-word;
    }

    th {
      position: sticky;
      top: 0;
      background: #0f1731;
      z-index: 1;
      font-weight: 700;
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.03);
    }

    .empty-state {
      padding: 22px 12px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .cell-sub {
      display: block;
      margin-top: 4px;
      color: #8594ba;
      font-size: 11px;
      line-height: 1.5;
    }

    .table-pill {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.15;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    /* Orthogonal axes shown under the status prose pill. Deliberately quieter than the
       pill: they qualify the state, they are not a second competing state. */
    .axis-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 5px;
    }

    .axis-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 10.5px;
      font-weight: 600;
      line-height: 1.4;
      white-space: nowrap;
      border: 1px solid rgba(148, 163, 184, 0.28);
      color: #9fb0d4;
      background: rgba(148, 163, 184, 0.1);
    }

    .axis-cluster {
      border-color: rgba(125, 211, 252, 0.34);
      color: #7dd3fc;
      background: rgba(125, 211, 252, 0.12);
    }

    .axis-activity {
      border-color: rgba(251, 191, 36, 0.32);
      color: #fbbf24;
      background: rgba(251, 191, 36, 0.11);
    }

    .footnote {
      padding: 14px 18px 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .popup-title {
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 6px;
    }

    .popup-grid {
      display: grid;
      grid-template-columns: 104px 1fr;
      gap: 6px 8px;
      font-size: 12px;
    }

    .popup-label {
      color: #69758f;
      font-size: 11px;
      line-height: 1.45;
    }

    .popup-value-primary {
      color: #1f2937;
      line-height: 1.45;
    }

    .leaflet-popup-content-wrapper {
      border-radius: 14px;
    }

    .leaflet-popup-content {
      margin: 12px 14px;
      line-height: 1.45;
      min-width: 280px;
    }

    .loading-note,
    .error-note {
      padding: 18px 16px 6px;
      color: var(--muted);
      font-size: 14px;
    }

    .error-note {
      color: #ffb4c2;
    }

    /* Shown only when the visible set contains rows without coordinates, so the
       (legitimate) gap between table rows and map markers is stated rather than silent. */
    .unmapped-note {
      padding: 10px 16px 2px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 1180px) {
      .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 980px) {
      .stats {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .toolbar {
        grid-template-columns: 1fr 1fr;
      }

      .risk-grid {
        grid-template-columns: 1fr;
      }

      .updates-grid {
        grid-template-columns: 1fr;
      }

      .company-summary-grid,
      .focus-grid,
      .ranking-grid {
        grid-template-columns: 1fr;
      }

      #map {
        height: 560px;
      }
    }

    @media (max-width: 640px) {
      .wrap {
        width: min(96vw, 100%);
        margin-top: 14px;
      }

      .hero,
      .findings {
        padding-inline: 18px;
      }

      .page-nav {
        top: 8px;
      }

      .hero-topbar,
      .toolbar-meta,
      .table-title {
        flex-direction: column;
        align-items: flex-start;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 26px;
      }

      .leaflet-popup-content {
        min-width: 0;
      }

      .popup-grid {
        grid-template-columns: 1fr;
      }

      /* ---- Mobile table triage ----
         The project table is ~2,238px wide (14 inline column widths) and the company
         tables are 1,180-1,400px. The iframe is rendered with scrolling="no", so anything
         that escapes an overflow container is *clipped*, not scrollable. Two measures:
         (1) guarantee each table sits in a real horizontal scroller with a visible hint,
         (2) drop the three long narrative columns so the remaining width is tractable.
         Phase 6 replaces this with proper cards; this is triage, not the destination. */
      .tablewrap,
      .company-tablewrap {
        overflow-x: auto;
        overscroll-behavior-x: contain;
        -webkit-overflow-scrolling: touch;
      }

      .table-scroll-hint {
        display: block;
      }

      /* 11 地址 · 12 运输/出口路线 · 14 数据来源摘要 — the narrative columns.
         Kept in the DOM (and in the search haystack), just not rendered at this width. */
      #dataTable th:nth-child(11),
      #dataTable td:nth-child(11),
      #dataTable th:nth-child(12),
      #dataTable td:nth-child(12),
      #dataTable th:nth-child(14),
      #dataTable td:nth-child(14) {
        display: none;
      }

      /* Deliberately NOT `width: auto`. Letting 11 columns share 375px squeezes each to
         ~34px, so every cell wraps into a tall stack and the table grows to ~41,000px —
         far worse than scrolling. Keeping the declared widths gives normal ~2-line rows
         and a horizontal scroll the hint above already advertises. */
      #dataTable th:nth-child(6),
      #dataTable td:nth-child(6),
      #dataTable th:nth-child(13),
      #dataTable td:nth-child(13) {
        max-width: 190px;
      }
    }

    /* ---- Update log (changelog) ---- */
    .changelog-card {
      padding: 0;
      overflow: hidden;
    }
    .changelog-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      cursor: pointer;
      list-style: none;
      user-select: none;
    }
    .changelog-summary::-webkit-details-marker { display: none; }
    .changelog-summary-main {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }
    .changelog-latest {
      color: var(--muted);
      font-size: 13px;
    }
    .changelog-latest b { color: var(--gold); font-weight: 600; }
    .changelog-hint {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .changelog-hint::before { content: "▸ "; }
    .changelog-card[open] .changelog-hint::before { content: "▾ "; }
    .changelog-tablewrap {
      overflow-x: auto;
      border-top: 1px solid var(--line);
    }
    .changelog-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .changelog-table th,
    .changelog-table td {
      text-align: left;
      padding: 10px 18px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    .changelog-table th {
      color: var(--muted);
      font-weight: 600;
      background: var(--panel2);
      white-space: nowrap;
    }
    .changelog-table tr:last-child td { border-bottom: none; }
    .changelog-date { color: var(--gold); font-weight: 600; white-space: nowrap; }
    .changelog-asof { color: var(--muted); white-space: nowrap; }
    .changelog-items { margin: 0; padding-left: 18px; }
    .changelog-items li { margin: 2px 0; line-height: 1.55; }

    /* ---- Market-cap cell ---- */
    .company-table td.mktcap { color: var(--gold); font-variant-numeric: tabular-nums; }

    /* ---- Database: updated row ---- */
    tr.row-updated { background: rgba(120, 167, 255, 0.10); }
    .db-updated-pill {
      display: inline-block; margin-left: 6px; padding: 1px 6px;
      font-size: 11px; border-radius: 6px; white-space: nowrap;
      color: var(--accent); background: rgba(120, 167, 255, 0.14); border: 1px solid rgba(120, 167, 255, 0.32);
    }

    /* ---- Changelog diff (this vs previous) ---- */
    /* overflow-x here is load-bearing: the parent .changelog-card sets overflow:hidden for
       its rounded corners, so without an inner scroller this ~400px table is CLIPPED rather
       than scrollable on narrow screens, silently hiding the "this vs last" comparison. */
    .changelog-diff { padding: 12px 18px 0; overflow-x: auto; }
    .changelog-diff-title { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .changelog-diff-table { border-collapse: collapse; font-size: 13px; width: auto; }
    .changelog-diff-table th, .changelog-diff-table td {
      text-align: left; padding: 5px 16px 5px 0; border-bottom: 1px solid var(--line); white-space: nowrap;
    }
    .changelog-diff-table th { color: var(--muted); font-weight: 600; }
    .changelog-diff-table td.diff-old { color: var(--muted); }
    .changelog-diff-table td.diff-now { color: var(--text); font-weight: 600; }
    .changelog-diff-table td.diff-change { font-weight: 600; color: var(--muted); }
    .changelog-diff-table td.diff-change.diff-up { color: var(--green); }
    .changelog-diff-table td.diff-change.diff-down { color: var(--red); }

    /* ---- Research-update tags ---- */
    .update-tags { display: flex; gap: 6px; margin: 2px 0 6px; flex-wrap: wrap; }
    .tag { font-size: 11px; padding: 1px 8px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
    .tag-bull { color: #052e16; background: var(--green); }
    .tag-bear { color: #4c0519; background: var(--red); }
    .tag-neutral { color: #451a03; background: var(--gold); }
    .tag-horizon { color: var(--muted); background: transparent; border: 1px solid var(--line); }

    /* ---- Core price call ---- */
    .price-call { margin: 8px 0 4px; }
    .pc-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
    .pc-dir { font-size: 16px; font-weight: 700; padding: 3px 12px; border-radius: 8px; }
    .pc-bull { color: #052e16; background: var(--green); }
    .pc-neutral-bull { color: #073527; background: #7fd4b0; }
    .pc-neutral { color: #451a03; background: var(--gold); }
    .pc-bear { color: #4c0519; background: var(--red); }
    .pc-conf { display: flex; align-items: center; gap: 8px; }
    .pc-conf-label { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .pc-meter { width: 90px; height: 7px; border-radius: 4px; background: var(--panel2); overflow: hidden; }
    .pc-meter-fill { display: block; height: 100%; }
    .pc-fill-bull { background: var(--green); }
    .pc-fill-neutral-bull { background: #7fd4b0; }
    .pc-fill-neutral { background: var(--gold); }
    .pc-fill-bear { background: var(--red); }
    .pc-meta { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .pc-meta b { color: var(--text); font-weight: 600; }
    .pc-rationale { margin: 6px 0; padding-left: 18px; font-size: 13px; }
    .pc-rationale li { margin: 3px 0; line-height: 1.5; }
    .pc-delta { font-size: 12.5px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 6px; line-height: 1.55; }
    .pc-delta b { color: var(--text); }

    /* ---- View tabs (the 7-view IA) ---- */
    .view-tabs {
      position: sticky;
      top: 0;
      z-index: 14;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      -webkit-overflow-scrolling: touch;
      margin-bottom: 16px;
      padding: 10px 12px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(11, 16, 32, 0.94);
      backdrop-filter: blur(10px);
      scrollbar-width: none;
    }
    .view-tabs::-webkit-scrollbar { display: none; }

    .view-tab {
      flex: 0 0 auto;
      display: inline-flex;
      flex-direction: column;
      gap: 2px;
      padding: 8px 14px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
    }
    .view-tab .view-tab-hint {
      font-size: 11px;
      font-weight: 500;
      opacity: 0.72;
      white-space: nowrap;
    }
    .view-tab:hover { color: var(--text); background: rgba(255, 255, 255, 0.04); }
    .view-tab[aria-selected="true"] {
      color: #eef5ff;
      background: rgba(120, 167, 255, 0.16);
      border-color: rgba(120, 167, 255, 0.34);
    }
    .view-tab:focus-visible {
      outline: 2px solid var(--accent, #7dd3fc);
      outline-offset: 2px;
    }

    /* display:none (not visibility) is deliberate: it is what actually collapses the
       page height from ~14,000px to a few thousand. Leaflet needs invalidateSize() when
       the atlas view becomes visible again — see onEnter in app.js. */
    .view[hidden] { display: none; }
    .view { display: block; }

    /* ---- Empty states for data we do not have ---- */
    .empty-state-block {
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      border: 1px dashed rgba(148, 163, 184, 0.34);
      background: rgba(255, 255, 255, 0.02);
      padding: 22px 20px;
    }
    .empty-state-block + .empty-state-block { margin-top: 16px; }

    .empty-state-hatch {
      position: absolute;
      inset: 0;
      opacity: 0.08;
      background-image: repeating-linear-gradient(
        45deg, transparent 0 9px, currentColor 9px 10px
      );
      pointer-events: none;
    }
    .empty-state-body { position: relative; }
    .empty-state-body h3 { margin: 8px 0 6px; font-size: 16px; color: var(--text); }

    .empty-state-tag {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .is-undisclosed .empty-state-tag { background: rgba(251, 113, 133, 0.16); color: #fda4af; }
    .is-gap .empty-state-tag { background: rgba(246, 196, 83, 0.16); color: #fcd34d; }

    .empty-state-why { margin: 0 0 8px; color: var(--muted); font-size: 13px; line-height: 1.7; }
    .empty-state-needs { margin: 0 0 10px; color: var(--muted); font-size: 13px; line-height: 1.7; }
    .empty-state-needs b { color: #dbe7ff; }
    .empty-state-have { font-size: 13px; color: var(--muted); line-height: 1.7; }
    .empty-state-have b { color: #dbe7ff; }
    .empty-state-have ul { margin: 6px 0 0; padding-left: 18px; }
    .empty-state-have li { margin-bottom: 4px; }

    /* ---- Gap register (method view) ---- */
    .gap-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .gap-table th, .gap-table td {
      text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line);
      vertical-align: top; line-height: 1.65;
    }
    .gap-table th { color: var(--muted); font-weight: 600; white-space: nowrap; }
    .gap-pill {
      display: inline-block; padding: 2px 9px; border-radius: 999px;
      font-size: 11px; font-weight: 700; white-space: nowrap;
    }
    .gap-pill.is-undisclosed { background: rgba(251, 113, 133, 0.16); color: #fda4af; }
    .gap-pill.is-gap { background: rgba(246, 196, 83, 0.16); color: #fcd34d; }

    /* ---- Metric envelopes (components/metric.js) ----
       Every tile is the same height whether or not it has a number: a missing metric keeps
       its frame and states WHY it is missing. Collapsing empties would make the grid
       shorter exactly when there is more to explain, and would move the page height
       around under the iframe height contract. */
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(268px, 1fr));
      gap: 14px;
    }

    .metric-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 176px;
      padding: 15px 16px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.022);
    }

    .metric-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .metric-label {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      color: #dbe7ff;
      line-height: 1.45;
    }

    .metric-chips { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }

    .metric-chip {
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
      background: rgba(148, 163, 184, 0.13);
      color: #9fb0d4;
    }

    .metric-kind-observed { background: rgba(74, 222, 128, 0.13); color: #86efac; }
    .metric-kind-consensus { background: rgba(96, 165, 250, 0.14); color: #93c5fd; }
    .metric-kind-company_guidance { background: rgba(167, 139, 250, 0.14); color: #c4b5fd; }
    .metric-kind-own_calc { background: rgba(246, 196, 83, 0.15); color: #fcd34d; }
    .metric-kind-assumption { background: rgba(148, 163, 184, 0.15); color: #cbd5e1; }

    .metric-fresh-aging { background: rgba(246, 196, 83, 0.17); color: #fcd34d; }
    .metric-fresh-stale { background: rgba(251, 113, 133, 0.17); color: #fda4af; }

    .metric-value { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
    .metric-number {
      font-size: 27px;
      font-weight: 750;
      letter-spacing: -0.02em;
      color: #f4f8ff;
      font-variant-numeric: tabular-nums;
    }
    .metric-unit { font-size: 12px; color: var(--muted); }

    .metric-null {
      position: relative;
      flex: 1;
      border-radius: 10px;
      padding: 11px 12px;
      background-image: repeating-linear-gradient(45deg, transparent 0 9px, currentColor 9px 10px);
      background-color: rgba(255, 255, 255, 0.015);
    }
    .metric-null > * { position: relative; }
    .metric-null.is-undisclosed { color: rgba(251, 113, 133, 0.5); }
    .metric-null.is-gap { color: rgba(246, 196, 83, 0.5); }

    .metric-null-tag {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 700;
    }
    .is-undisclosed .metric-null-tag { background: rgba(251, 113, 133, 0.2); color: #fda4af; }
    .is-gap .metric-null-tag { background: rgba(246, 196, 83, 0.2); color: #fcd34d; }

    .metric-null-why {
      margin: 7px 0 0;
      font-size: 11.5px;
      line-height: 1.65;
      color: var(--muted);
    }

    .metric-note { margin: 0; font-size: 11.5px; line-height: 1.6; color: var(--muted); }

    .metric-foot {
      margin-top: auto;
      padding-top: 9px;
      border-top: 1px solid var(--line);
      font-size: 11px;
      line-height: 1.6;
      color: #8594ba;
    }
    .metric-basis { margin-bottom: 3px; }
    .metric-basis b { color: #9fb0d4; font-weight: 600; margin-right: 4px; }
    .metric-prov { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
    .metric-prov a { color: #93c5fd; text-decoration: none; }
    .metric-prov a:hover { text-decoration: underline; }
    .metric-dot { opacity: 0.5; }

    .market-unavailable {
      margin: 0;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px dashed rgba(251, 113, 133, 0.34);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    @media (max-width: 640px) {
      .view-tabs { padding: 8px; gap: 6px; }
      .view-tab { padding: 7px 11px; font-size: 12px; }
      .view-tab .view-tab-hint { display: none; }
      .gap-table { display: block; overflow-x: auto; }
    }
  </style>
</head>
<body>
  <div class="wrap" id="app">
    <header class="page-header">
      <div class="card hero">
        <div class="hero-topbar">
          <div class="eyebrow" id="heroEyebrow">Lithium Research 2026</div>
        </div>
        <h1 id="heroTitle">全球锂资源项目地图与数据库（2026）</h1>
        <p id="heroIntro1"></p>
        <p id="heroIntro2"></p>
        <div class="badge-row" id="heroBadges"></div>
        <div class="resource-links">
          <a class="resource-link" href="/data/global-lithium-database-2026.csv" download id="resourceCsvLink"></a>
          <a class="resource-link" href="/data/global-lithium-key-findings-2026.md" download id="resourceMdLink"></a>
        </div>
      </div>
    </header>

    <nav class="view-tabs" id="viewTabs" role="tablist" aria-label="报告视图"></nav>

    <main id="viewHost">

      <section class="view" data-view="cockpit" id="view-cockpit" role="tabpanel" aria-labelledby="tab-cockpit">
        <div class="side-stack">
        <div class="card stats" id="statsSection">
          <div class="stat">
            <div class="k" id="statProjectLabel"></div>
            <div class="v" id="statProjectCount">--</div>
          </div>
          <div class="stat">
            <div class="k" id="statCountryLabel"></div>
            <div class="v" id="statCountryCount">--</div>
          </div>
          <div class="stat">
            <div class="k" id="statOperatingLabel"></div>
            <div class="v" id="statOperatingCount">--</div>
            <div class="sub" id="statOperatingSub"></div>
          </div>
          <div class="stat">
            <div class="k" id="statCurrentCapacityLabel"></div>
            <div class="v" id="statCurrentCapacity">--</div>
            <div class="sub" id="statCurrentCapacityUnit"></div>
          </div>
          <div class="stat">
            <div class="k" id="statPlannedCapacityLabel"></div>
            <div class="v" id="statPlannedCapacity">--</div>
            <div class="sub" id="statPlannedCapacityUnit"></div>
          </div>
          <div class="stat">
            <div class="k" id="statPipelineLabel"></div>
            <div class="v" id="statPipelineCount">--</div>
            <div class="sub" id="statPipelineSub"></div>
          </div>
        </div>

        <div class="card findings" id="findingsSection">
          <div class="section-kicker" id="priceCallKicker"></div>
          <div class="price-call" id="priceCall"></div>
          <div class="section-kicker" id="findingsKicker" style="margin-top:18px;"></div>
          <ol class="findings-list" id="findingsList"></ol>
          <div class="section-kicker" id="riskKicker" style="margin-top:18px;"></div>
          <div class="risk-grid" id="riskGrid"></div>
        </div>
      </div>

    <section class="card" id="keyMetricsSection">
      <div class="section-kicker" id="keyMetricsKicker"></div>
      <p class="section-note" id="keyMetricsNote"></p>
      <div id="keyMetricsGrid"></div>
    </section>

    <details class="card changelog-card" id="changelogSection" open>
      <summary class="changelog-summary">
        <span class="changelog-summary-main">
          <span class="section-kicker" id="changelogKicker"></span>
          <span class="changelog-latest" id="changelogLatest"></span>
        </span>
        <span class="changelog-hint" id="changelogHint"></span>
      </summary>
      <div class="changelog-diff" id="changelogDiff"></div>
      <div class="changelog-tablewrap">
        <table class="changelog-table">
          <thead>
            <tr id="changelogHead"></tr>
          </thead>
          <tbody id="changelogBody"></tbody>
        </table>
      </div>
    </details>

    <section class="card updates-section" id="researchUpdatesSection">
      <div class="updates-header">
        <div class="section-kicker" id="updatesKicker"></div>
        <h2 id="updatesTitle"></h2>
        <p id="updatesSubtitle"></p>
      </div>
      <div class="updates-grid" id="updatesGrid"></div>
    </section>

      </section>

      <section class="view" data-view="supply" id="view-supply" role="tabpanel" aria-labelledby="tab-supply" hidden>
        <div class="card" id="supplySection"></div>
      </section>

      <section class="view" data-view="cost" id="view-cost" role="tabpanel" aria-labelledby="tab-cost" hidden>
        <div class="card" id="costSection"></div>
      </section>

      <section class="view" data-view="equities" id="view-equities" role="tabpanel" aria-labelledby="tab-equities" hidden>

    <section class="card company-section" id="companyResearchSection">
      <div class="company-header">
        <div class="section-kicker" id="companyKicker"></div>
        <h2 id="companyTitle"></h2>
        <p id="companySubtitle"></p>
      </div>
      <div class="company-subnav" id="companySubnav"></div>

      <div class="company-block" id="quickTakeSection">
        <div class="company-block-header">
          <h2 id="quickTakeTitle"></h2>
          <p id="quickTakeSubtitle"></p>
        </div>
        <div class="company-summary-grid" id="quickTakeGrid"></div>
        <div class="section-note" id="quickTakeNote"></div>
      </div>

      <div class="company-block" id="domesticEquitiesSection">
        <div class="company-block-header">
          <h2 id="domesticTitle"></h2>
          <p id="domesticSubtitle"></p>
        </div>
        <div class="company-tablewrap">
          <table class="company-table" id="domesticTable">
            <thead>
              <tr id="domesticTableHead"></tr>
            </thead>
            <tbody id="domesticTableBody"></tbody>
          </table>
        </div>
        <div class="section-note" id="domesticNote"></div>
      </div>

      <div class="company-block" id="globalEquitiesSection">
        <div class="company-block-header">
          <h2 id="globalTitle"></h2>
          <p id="globalSubtitle"></p>
        </div>
        <div class="company-tablewrap">
          <table class="company-table" id="globalTable">
            <thead>
              <tr id="globalTableHead"></tr>
            </thead>
            <tbody id="globalTableBody"></tbody>
          </table>
        </div>
        <div class="section-note" id="globalNote"></div>
      </div>

      <div class="company-block" id="resourceMatrixSection">
        <div class="company-block-header">
          <h2 id="matrixTitle"></h2>
          <p id="matrixSubtitle"></p>
        </div>
        <div class="company-tablewrap">
          <table class="company-table matrix-table" id="matrixTable">
            <thead>
              <tr id="matrixTableHead"></tr>
            </thead>
            <tbody id="matrixTableBody"></tbody>
          </table>
        </div>
      </div>

      <div class="company-block" id="focusVariablesSection">
        <div class="company-block-header">
          <h2 id="focusTitle"></h2>
          <p id="focusSubtitle"></p>
        </div>
        <div class="focus-grid" id="focusGrid"></div>
      </div>

      <div class="company-block" id="rankingSection">
        <div class="company-block-header">
          <h2 id="rankingTitle"></h2>
          <p id="rankingSubtitle"></p>
        </div>
        <div class="ranking-grid" id="rankingGrid"></div>
        <div class="final-callout">
          <h3 id="finalCallTitle"></h3>
          <p id="finalCallBody"></p>
        </div>
      </div>
    </section>

      </section>

      <section class="view" data-view="atlas" id="view-atlas" role="tabpanel" aria-labelledby="tab-atlas" hidden>

    <div class="card" id="projectMapSection">
      <div class="toolbar">
        <input id="searchBox" />
        <select id="statusFilter"></select>
        <select id="countryFilter"></select>
        <select id="structureFilter"></select>
        <select id="sortFilter"></select>
      </div>
      <div class="toolbar-meta">
        <div class="result-summary" id="resultSummary"></div>
      </div>
      <div class="legend" id="legend"></div>
      <div id="loadingNote" class="loading-note"></div>
      <div id="errorNote" class="error-note" hidden></div>
      <div class="mapbox">
        <div id="map"></div>
      </div>
      <div id="unmappedNote" class="unmapped-note" hidden></div>
    </div>

    <div class="card tablewrap" id="projectDatabaseSection">
      <div class="table-title">
        <h2 id="tableTitle"></h2>
        <p id="tableSubtitle"></p>
      </div>
      <p class="table-scroll-hint" id="tableScrollHint"></p>
      <table id="dataTable">
        <thead>
          <tr id="dataTableHead"></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

      </section>

      <section class="view" data-view="catalysts" id="view-catalysts" role="tabpanel" aria-labelledby="tab-catalysts" hidden>
        <div class="card" id="catalystsSection"></div>
      </section>

      <section class="view" data-view="method" id="view-method" role="tabpanel" aria-labelledby="tab-method" hidden>
        <div class="card footnote" id="methodologySection"></div>
        <div class="card" id="gapRegisterSection"></div>
      </section>

    </main>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script type="module" src="./app.js?v=2026-07-27"></script>
