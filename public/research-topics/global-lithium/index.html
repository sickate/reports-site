<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>全球锂资源项目地图与数据库（2026）</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    :root {
      --bg: #0b1020;
      --panel: #11182d;
      --panel2: #17203a;
      --text: #eef3ff;
      --muted: #a8b2cc;
      --line: #2a365d;
      --accent: #78a7ff;
      --green: #4ade80;
      --orange: #f59e0b;
      --purple: #a78bfa;
      --red: #fb7185;
      --gray: #94a3b8;
      --cyan: #22d3ee;
      --gold: #f6c453;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    html,
    body {
      margin: 0;
      padding: 0;
      scroll-behavior: smooth;
      background:
        radial-gradient(circle at top left, rgba(120, 167, 255, 0.14), transparent 30%),
        radial-gradient(circle at top right, rgba(246, 196, 83, 0.09), transparent 24%),
        var(--bg);
      color: var(--text);
      font-family: "IBM Plex Sans", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .wrap {
      width: min(1600px, 96vw);
      margin: 18px auto 28px;
    }

    /* The hero used to sit in a two-column grid beside the KPI + findings stack, which
       is what stretched it to the height of its neighbour and left the large blank the
       review flagged. It is now a full-width header and the cockpit stacks below it. */
    .page-header {
      display: block;
      margin-bottom: 16px;
    }

    .side-stack {
      display: grid;
      gap: 16px;
    }

    .card {
      background: linear-gradient(180deg, rgba(17, 24, 45, 0.96), rgba(23, 32, 58, 0.96));
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }

    .card[id],
    .company-block {
      scroll-margin-top: 86px;
    }

    .hero {
      padding: 24px 26px;
      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: auto -12% -45% auto;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(120, 167, 255, 0.22), transparent 65%);
      pointer-events: none;
    }

    .hero-topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #dbe7ff;
      background: rgba(120, 167, 255, 0.13);
      border: 1px solid rgba(120, 167, 255, 0.28);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 30px;
      line-height: 1.12;
      letter-spacing: 0.2px;
      max-width: 860px;
      position: relative;
      z-index: 1;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 18px;
      line-height: 1.2;
    }

    p {
      margin: 8px 0;
      color: var(--muted);
      line-height: 1.65;
      position: relative;
      z-index: 1;
    }

    .badge-row,
    .resource-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
      position: relative;
      z-index: 1;
    }

    .badge,
    .resource-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.035);
      color: var(--text);
    }

    .resource-link {
      transition: background 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
    }

    .resource-link:hover {
      border-color: rgba(120, 167, 255, 0.45);
      background: rgba(120, 167, 255, 0.1);
      transform: translateY(-1px);
    }

    .resource-link strong {
      color: #dfe9ff;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 12px;
      padding: 18px;
    }

    .stat {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
      min-height: 110px;
    }

    .stat .k {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
      line-height: 1.45;
    }

    .stat .v {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.3px;
      line-height: 1.15;
    }

    .stat .sub {
      margin-top: 4px;
      font-size: 12px;
      color: #7f91bd;
    }

    .findings {
      padding: 18px 20px 20px;
    }

    .section-kicker {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: #8fb0ff;
      margin-bottom: 10px;
    }

    .findings-list {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
      line-height: 1.6;
    }

    .findings-list li + li {
      margin-top: 10px;
    }

    .findings-list strong {
      color: #eff4ff;
    }

    .risk-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .risk-pill {
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid rgba(246, 196, 83, 0.2);
      background: rgba(246, 196, 83, 0.06);
      color: #f8e8bb;
      font-size: 12px;
      line-height: 1.5;
    }

    .updates-section {
      margin-bottom: 16px;
      padding: 20px 22px 22px;
    }

    .page-nav {
      position: sticky;
      top: 12px;
      z-index: 12;
      margin-bottom: 16px;
      padding: 12px 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      background: rgba(17, 24, 45, 0.92);
      backdrop-filter: blur(10px);
    }

    .page-nav-link,
    .subnav-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 13px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.032);
      color: #dbe7ff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    }

    .page-nav-link:hover,
    .subnav-link:hover {
      transform: translateY(-1px);
      border-color: rgba(120, 167, 255, 0.42);
      background: rgba(120, 167, 255, 0.1);
    }

    .updates-header {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 18px;
    }

    .updates-header p {
      margin: 0;
      max-width: 1100px;
    }

    .updates-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .update-card {
      border: 1px solid rgba(120, 167, 255, 0.14);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.028);
      padding: 16px 16px 15px;
    }

    .update-index {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: rgba(120, 167, 255, 0.15);
      color: #dbe7ff;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .update-title {
      margin: 0 0 8px;
      font-size: 16px;
      line-height: 1.35;
      color: #eef4ff;
    }

    .update-body,
    .update-note {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .update-note {
      margin-top: 10px;
      color: #d6e1ff;
    }

    .update-points {
      margin: 10px 0 0;
      padding-left: 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
      list-style: disc;
    }

    .update-points li + li {
      margin-top: 8px;
    }

    .company-section {
      margin-bottom: 16px;
      padding: 20px 22px 22px;
    }

    .company-header p {
      margin: 0;
      max-width: 1150px;
    }

    .company-subnav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 16px 0 18px;
    }

    .company-block + .company-block {
      margin-top: 20px;
    }

    .company-block-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .company-block-header p {
      margin: 0;
      font-size: 13px;
    }

    .company-summary-grid,
    .focus-grid,
    .ranking-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .focus-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .summary-card,
    .focus-card,
    .ranking-card,
    .final-callout {
      border: 1px solid rgba(120, 167, 255, 0.14);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.026);
      padding: 16px 16px 15px;
    }

    .summary-card h3,
    .focus-card h3,
    .ranking-card h3 {
      margin: 0 0 8px;
      font-size: 16px;
      line-height: 1.35;
      color: #eef4ff;
    }

    .summary-card p,
    .focus-card p,
    .ranking-card p,
    .final-callout p {
      margin: 0;
      font-size: 13px;
      line-height: 1.7;
    }

    .summary-card ul {
      margin: 10px 0 0;
      padding-left: 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .summary-card li + li {
      margin-top: 8px;
    }

    .section-note {
      margin-top: 12px;
      color: #d6e1ff;
      font-size: 13px;
      line-height: 1.7;
    }

    .company-tablewrap {
      overflow: auto;
      border: 1px solid rgba(120, 167, 255, 0.1);
      border-radius: 18px;
    }

    .company-table {
      min-width: 1180px;
    }

    .company-table th {
      background: #101834;
    }

    .company-name {
      font-weight: 700;
      color: #eef4ff;
    }

    .num {
      white-space: nowrap;
    }

    .matrix-table {
      min-width: 1400px;
    }

    .pill-inline {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 9px;
      border-radius: 999px;
      border: 1px solid rgba(246, 196, 83, 0.22);
      background: rgba(246, 196, 83, 0.08);
      color: #f8e8bb;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 10px;
    }

    .ranking-list {
      margin-top: 10px;
      color: #eef4ff;
      font-weight: 700;
      line-height: 1.6;
    }

    .final-callout {
      margin-top: 20px;
      background:
        radial-gradient(circle at top right, rgba(120, 167, 255, 0.15), transparent 36%),
        rgba(255, 255, 255, 0.03);
    }

    .final-callout h3 {
      margin: 0 0 10px;
      font-size: 18px;
      color: #f4f8ff;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 170px 170px 150px 170px;
      gap: 10px;
      padding: 14px 16px 8px;
    }

    input,
    select {
      background: #0d1430;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
    }

    input::placeholder {
      color: #8190b6;
    }

    .toolbar-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 0 16px 12px;
      flex-wrap: wrap;
    }

    .result-summary {
      color: #dce6ff;
      font-size: 13px;
      font-weight: 600;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      padding: 0 16px 16px;
      color: var(--muted);
      font-size: 13px;
    }

    .legend-filter {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 11px;
      background: rgba(255, 255, 255, 0.035);
      color: var(--text);
      cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease, opacity 0.18s ease, transform 0.18s ease;
    }

    .legend-filter:hover {
      border-color: rgba(120, 167, 255, 0.38);
      transform: translateY(-1px);
    }

    .legend-filter.is-inactive {
      opacity: 0.45;
      background: rgba(255, 255, 255, 0.015);
      color: #8c99bb;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
      vertical-align: middle;
    }

    #map {
      height: 760px;
      width: 100%;
      border-radius: 18px;
    }

    .mapbox {
      padding: 10px;
      position: relative;
    }

    .map-regions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 10px 10px;
    }

    .map-region-btn {
      cursor: pointer;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text);
      border-radius: 999px;
      padding: 6px 12px;
      font: inherit;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }

    .map-region-btn:hover:not(:disabled) {
      border-color: rgba(120, 167, 255, 0.38);
      transform: translateY(-1px);
    }

    /* Disabled when the region has no visible projects, which makes this chip row double
       as a live geographic facet rather than a static set of shortcuts. */
    .map-region-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .map-region-count {
      color: var(--muted);
      font-size: 11px;
    }

    .map-size-legend {
      background: rgba(11, 16, 32, 0.9);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px 10px;
      color: var(--text);
      backdrop-filter: blur(6px);
    }

    .map-size-legend-title {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .map-size-legend-rows {
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }

    .map-size-legend-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 11px;
      color: var(--muted);
    }

    /* ---- Project detail drawer ------------------------------------------------------
       `position: absolute`, NOT fixed. The React wrapper sizes this iframe to its full
       content height and sets scrolling="no", so the iframe's viewport IS the whole
       ~6,000px document — `position: fixed; top: 0` would pin the panel to the top of a
       document the reader is scrolled 4,000px into, i.e. nowhere they can see.

       Sitting inside .mapbox also means it contributes nothing to appRoot.scrollHeight,
       so on desktop it needs no height re-post at all. */
    .project-drawer {
      position: absolute;
      inset: 12px 12px 12px auto;
      width: min(400px, 62%);
      z-index: 900; /* above Leaflet panes (400-700), below its controls (1000) */
      overflow-y: auto;
      overscroll-behavior: contain;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(11, 16, 32, 0.96);
      backdrop-filter: blur(8px);
      box-shadow: var(--shadow);
      padding: 14px 16px 16px;
    }

    .drawer-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .drawer-head h3 {
      margin: 0;
      font-size: 16px;
      line-height: 1.25;
    }

    .drawer-close {
      cursor: pointer;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      border-radius: 8px;
      width: 28px;
      height: 28px;
      font-size: 16px;
      line-height: 1;
      flex: none;
    }

    .drawer-close:hover {
      border-color: rgba(120, 167, 255, 0.45);
    }

    .drawer-section + .drawer-section {
      margin-top: 12px;
    }

    .drawer-section h4 {
      margin: 0 0 6px;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #8fb0ff;
    }

    .drawer-section dl {
      margin: 0;
      display: grid;
      grid-template-columns: 92px 1fr;
      gap: 4px 10px;
      font-size: 12px;
      line-height: 1.55;
    }

    .drawer-section dt {
      color: var(--muted);
    }

    .drawer-section dd {
      margin: 0;
      color: var(--text);
      overflow-wrap: anywhere;
    }

    /* Selected row highlight. The frozen first cell is opaque, so its tint has to be
       pre-composited like the hover/updated ones above. */
    #dataTable tbody tr.is-selected td {
      background: rgba(120, 167, 255, 0.14);
    }

    #dataTable tbody tr.is-selected td:first-child {
      background: #1d2a52;
    }

    .row-open {
      cursor: pointer;
      border: 0;
      background: none;
      padding: 0;
      color: inherit;
      font: inherit;
      text-align: left;
      text-decoration: underline;
      text-decoration-color: rgba(120, 167, 255, 0.4);
      text-underline-offset: 3px;
    }

    .row-open:hover {
      color: #dbe7ff;
      text-decoration-color: rgba(120, 167, 255, 0.9);
    }

    .tablewrap {
      margin-top: 16px;
      padding: 10px 12px 16px;
      overflow: visible;
    }

    /* The table's scrollport, and it must contain the table and NOTHING else.
       Three things depend on that:

       1. `th { position: sticky; top: 0 }` is measured against the nearest scrollport.
          This used to be `.tablewrap`, which has `overflow: auto` but no height cap — so
          it never scrolled, the sticky offset never engaged, and the header quietly
          scrolled away with the page. It looked implemented and was not.
       2. `.tablewrap` carries `padding: 10px 12px 16px`; a `position: sticky; left: 0`
          cell cannot sit flush against a padded scrollport.
       3. `.table-title` and the scroll hint live in `.tablewrap`. With scrolling there,
          dragging the table sideways dragged the heading out of view too.

       The cap is `min(72vh, 820px)`: tall enough that the whole 44-row table is one or
       two flicks away, short enough that the header has something to stick to. */
    .table-scroll {
      overflow: auto;
      max-height: min(72vh, 820px);
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      border-top: 1px solid var(--line);
    }

    .column-groups {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 2px 6px 10px;
    }

    .column-group-btn {
      cursor: pointer;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text);
      border-radius: 999px;
      padding: 6px 12px;
      font: inherit;
      font-size: 12px;
      line-height: 1.4;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }

    .column-group-btn:hover {
      border-color: rgba(120, 167, 255, 0.38);
      transform: translateY(-1px);
    }

    .column-group-btn[aria-checked='true'] {
      background: rgba(120, 167, 255, 0.16);
      border-color: rgba(120, 167, 255, 0.55);
      color: #dbe6ff;
      font-weight: 600;
    }

    .column-group-btn .column-group-hint {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
    }

    /* Was hidden by default and switched on only under 640px, back when it warned about
       a horizontal scroll. It now explains the column-group switcher and the frozen
       column, which is useful at every width, so it is always shown. */
    .table-scroll-hint {
      display: block;
      padding: 0 6px 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .table-title {
      padding: 8px 6px 6px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }

    .table-title p {
      margin: 0;
      font-size: 13px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 13px;
    }

    /* app.js sets --table-min-width from the active column group's declared widths.
       With `width: 100%; table-layout: fixed` this gives the right behaviour both ways:
       a narrow group on a wide viewport stretches proportionally and never scrolls, a
       wide group or narrow viewport pins the declared px and scrolls horizontally. */
    #dataTable {
      min-width: var(--table-min-width, 0);
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 10px 8px;
      vertical-align: top;
      text-align: left;
      word-wrap: break-word;
    }

    th {
      position: sticky;
      top: 0;
      background: #0f1731;
      z-index: 1;
      font-weight: 700;
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.03);
    }

    /* ---- Frozen first column -------------------------------------------------------
       `left: 0` here and `top: 0` on th are two INDEPENDENT axes of the same sticky
       positioning. The corner cell needs both plus a z-index above each, or whichever
       axis is currently scrolling paints over it. Layers: 1 = header row, 2 = frozen
       column, 3 = the corner where they meet.

       The background MUST be opaque. A sticky cell composites over the content sliding
       underneath it; a transparent one shows both at once and reads as a rendering bug.

       Kept on `border-collapse: collapse` — the existing th rule already proves sticky
       works with it. The one artefact is that collapsed VERTICAL borders are painted by
       the table rather than the cell, so the frozen column's right edge can vanish while
       scrolled; hence `inset` box-shadow instead of `border-right`. Do NOT switch to
       `border-collapse: separate` to "fix" that — it would change every border on both
       company tables and reintroduce cell spacing. */
    #dataTable th:first-child,
    #dataTable td:first-child {
      position: sticky;
      left: 0;
      z-index: 2;
      background: #101833;
      box-shadow:
        inset -1px 0 0 var(--line),
        8px 0 10px -8px rgba(0, 0, 0, 0.55);
    }

    #dataTable thead th:first-child {
      z-index: 3;
      background: #0f1731;
    }

    /* The row tints elsewhere are rgba OVERLAYS on a transparent cell. On an opaque
       sticky cell they have to be pre-composited, or the frozen cell reads as
       un-highlighted next to the highlighted rest of its own row. These are those
       overlays flattened onto #101833. */
    #dataTable tbody tr:hover td:first-child { background: #161e37; }
    #dataTable tbody tr.row-updated td:first-child { background: #1a2546; }
    #dataTable tbody tr.row-updated:hover td:first-child { background: #1e2a4d; }

    .empty-state {
      padding: 22px 12px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .cell-sub {
      display: block;
      margin-top: 4px;
      color: #8594ba;
      font-size: 11px;
      line-height: 1.5;
    }

    .table-pill {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.15;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    /* Orthogonal axes shown under the status prose pill. Deliberately quieter than the
       pill: they qualify the state, they are not a second competing state. */
    .axis-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 5px;
    }

    .axis-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 10.5px;
      font-weight: 600;
      line-height: 1.4;
      white-space: nowrap;
      border: 1px solid rgba(148, 163, 184, 0.28);
      color: #9fb0d4;
      background: rgba(148, 163, 184, 0.1);
    }

    .axis-cluster {
      border-color: rgba(125, 211, 252, 0.34);
      color: #7dd3fc;
      background: rgba(125, 211, 252, 0.12);
    }

    .axis-activity {
      border-color: rgba(251, 191, 36, 0.32);
      color: #fbbf24;
      background: rgba(251, 191, 36, 0.11);
    }

    .footnote {
      padding: 14px 18px 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .popup-title {
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 6px;
    }

    .popup-grid {
      display: grid;
      grid-template-columns: 104px 1fr;
      gap: 6px 8px;
      font-size: 12px;
    }

    .popup-label {
      color: #69758f;
      font-size: 11px;
      line-height: 1.45;
    }

    .popup-value-primary {
      color: #1f2937;
      line-height: 1.45;
    }

    .leaflet-popup-content-wrapper {
      border-radius: 14px;
    }

    .leaflet-popup-content {
      margin: 12px 14px;
      line-height: 1.45;
      min-width: 280px;
    }

    .loading-note,
    .error-note {
      padding: 18px 16px 6px;
      color: var(--muted);
      font-size: 14px;
    }

    .error-note {
      color: #ffb4c2;
    }

    /* Shown only when the visible set contains rows without coordinates, so the
       (legitimate) gap between table rows and map markers is stated rather than silent. */
    .unmapped-note {
      padding: 10px 16px 2px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 1180px) {
      .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 980px) {
      .stats {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .toolbar {
        grid-template-columns: 1fr 1fr;
      }

      .risk-grid {
        grid-template-columns: 1fr;
      }

      .updates-grid {
        grid-template-columns: 1fr;
      }

      .company-summary-grid,
      .focus-grid,
      .ranking-grid {
        grid-template-columns: 1fr;
      }

      #map {
        height: 560px;
      }
    }

    @media (max-width: 640px) {
      .wrap {
        width: min(96vw, 100%);
        margin-top: 14px;
      }

      .hero,
      .findings {
        padding-inline: 18px;
      }

      .page-nav {
        top: 8px;
      }

      .hero-topbar,
      .toolbar-meta,
      .table-title {
        flex-direction: column;
        align-items: flex-start;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 26px;
      }

      .leaflet-popup-content {
        min-width: 0;
      }

      .popup-grid {
        grid-template-columns: 1fr;
      }

      /* In the card layout the drawer leaves the map overlay and joins normal flow
         under it, because a 400px floating panel over a 560px map on a 375px screen
         covers the thing it is describing. Unlike the desktop variant this DOES change
         the document height, so the height triple has to fire — see notifyHeightTriple()
         in app.js, called from render() when the selection changes. */
      .project-drawer {
        position: static;
        inset: auto;
        width: auto;
        margin-top: 10px;
        max-height: none;
      }

      /* The company tables keep the old triage — they are still wide fixed tables and
         are not part of the project-table card treatment below. */
      .company-tablewrap {
        overflow-x: auto;
        overscroll-behavior-x: contain;
        -webkit-overflow-scrolling: touch;
      }

      /* ---- Project table becomes cards (Phase 6) ------------------------------------
         Replaces the old triage, which horizontally scrolled the table and hid three
         narrative columns at this width. Now nothing is hidden: every cell becomes a
         labelled line, using the `data-label` renderTable() already writes on each <td>.

         CSS-only, deliberately. Keeping one <tr> per project means
         `tbody tr:not(.is-empty-state)` still counts rows, so assertViewConsistency needs
         no mobile branch and there is no second render path to keep in step. A separate
         <article> renderer would double the renderer, need a resize listener to swap
         between them, and force the invariant to know which one ran.

         This does NOT violate "never squeeze the column widths". The 41,478px disaster
         came from eleven columns DIVIDING 375px inside a table layout; `display: block`
         removes table layout entirely, so each cell is a full-width block and a row is
         ~8 short labelled lines. Nothing is squeezed because nothing is being divided. */
      .table-scroll {
        max-height: none;
        overflow: visible;
        border-top: 0;
      }

      #dataTable {
        display: block;
        table-layout: auto;
        min-width: 0;
        font-size: 13px;
      }

      /* Takes the inline per-column th widths out of the layout with it. */
      #dataTable thead {
        display: none;
      }

      #dataTable tbody {
        display: block;
      }

      #dataTable tbody tr {
        display: block;
        border: 1px solid var(--line);
        border-radius: 14px;
        margin-bottom: 10px;
        padding: 8px 12px;
        background: rgba(255, 255, 255, 0.02);
      }

      #dataTable td {
        display: grid;
        grid-template-columns: 92px 1fr;
        gap: 10px;
        align-items: start;
        border: 0;
        padding: 6px 0;
      }

      #dataTable td::before {
        content: attr(data-label);
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }

      /* The frozen column is meaningless without a horizontal scroller — and an opaque
         sticky background inside a card reads as a stray filled box. Reset all of it. */
      #dataTable th:first-child,
      #dataTable td:first-child,
      #dataTable tbody tr:hover td:first-child,
      #dataTable tbody tr.row-updated td:first-child,
      #dataTable tbody tr.row-updated:hover td:first-child {
        position: static;
        box-shadow: none;
        background: transparent;
      }

      #dataTable td.num {
        text-align: left;
      }

      /* The empty-state cell spans a column count that no longer exists in this layout. */
      #dataTable tbody tr.is-empty-state {
        padding: 0;
      }

      #dataTable tbody tr.is-empty-state td {
        display: block;
      }

      #dataTable tbody tr.is-empty-state td::before {
        content: none;
      }
    }

    /* ---- Update log (changelog) ---- */
    .changelog-card {
      padding: 0;
      overflow: hidden;
    }
    .changelog-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      cursor: pointer;
      list-style: none;
      user-select: none;
    }
    .changelog-summary::-webkit-details-marker { display: none; }
    .changelog-summary-main {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }
    .changelog-latest {
      color: var(--muted);
      font-size: 13px;
    }
    .changelog-latest b { color: var(--gold); font-weight: 600; }
    .changelog-hint {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .changelog-hint::before { content: "▸ "; }
    .changelog-card[open] .changelog-hint::before { content: "▾ "; }
    .changelog-tablewrap {
      overflow-x: auto;
      border-top: 1px solid var(--line);
    }
    .changelog-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .changelog-table th,
    .changelog-table td {
      text-align: left;
      padding: 10px 18px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    .changelog-table th {
      color: var(--muted);
      font-weight: 600;
      background: var(--panel2);
      white-space: nowrap;
    }
    .changelog-table tr:last-child td { border-bottom: none; }
    .changelog-date { color: var(--gold); font-weight: 600; white-space: nowrap; }
    .changelog-asof { color: var(--muted); white-space: nowrap; }
    .changelog-items { margin: 0; padding-left: 18px; }
    .changelog-items li { margin: 2px 0; line-height: 1.55; }

    /* ---- Market-cap cell ---- */
    .company-table td.mktcap { color: var(--gold); font-variant-numeric: tabular-nums; }

    /* ---- Database: updated row ---- */
    tr.row-updated { background: rgba(120, 167, 255, 0.10); }
    .db-updated-pill {
      display: inline-block; margin-left: 6px; padding: 1px 6px;
      font-size: 11px; border-radius: 6px; white-space: nowrap;
      color: var(--accent); background: rgba(120, 167, 255, 0.14); border: 1px solid rgba(120, 167, 255, 0.32);
    }

    /* ---- Changelog diff (this vs previous) ---- */
    /* overflow-x here is load-bearing: the parent .changelog-card sets overflow:hidden for
       its rounded corners, so without an inner scroller this ~400px table is CLIPPED rather
       than scrollable on narrow screens, silently hiding the "this vs last" comparison. */
    .changelog-diff { padding: 12px 18px 0; overflow-x: auto; }
    .changelog-diff-title { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .changelog-diff-table { border-collapse: collapse; font-size: 13px; width: auto; }
    .changelog-diff-table th, .changelog-diff-table td {
      text-align: left; padding: 5px 16px 5px 0; border-bottom: 1px solid var(--line); white-space: nowrap;
    }
    .changelog-diff-table th { color: var(--muted); font-weight: 600; }
    .changelog-diff-table td.diff-old { color: var(--muted); }
    .changelog-diff-table td.diff-now { color: var(--text); font-weight: 600; }
    .changelog-diff-table td.diff-change { font-weight: 600; color: var(--muted); }
    .changelog-diff-table td.diff-change.diff-up { color: var(--green); }
    .changelog-diff-table td.diff-change.diff-down { color: var(--red); }

    /* ---- Research-update tags ---- */
    .update-tags { display: flex; gap: 6px; margin: 2px 0 6px; flex-wrap: wrap; }
    .tag { font-size: 11px; padding: 1px 8px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
    .tag-bull { color: #052e16; background: var(--green); }
    .tag-bear { color: #4c0519; background: var(--red); }
    .tag-neutral { color: #451a03; background: var(--gold); }
    .tag-horizon { color: var(--muted); background: transparent; border: 1px solid var(--line); }

    /* ---- Core price call ---- */
    .price-call { margin: 8px 0 4px; }
    .pc-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
    .pc-dir { font-size: 16px; font-weight: 700; padding: 3px 12px; border-radius: 8px; }
    .pc-bull { color: #052e16; background: var(--green); }
    .pc-neutral-bull { color: #073527; background: #7fd4b0; }
    .pc-neutral { color: #451a03; background: var(--gold); }
    .pc-bear { color: #4c0519; background: var(--red); }
    .pc-conf { display: flex; align-items: center; gap: 8px; }
    .pc-conf-label { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .pc-meter { width: 90px; height: 7px; border-radius: 4px; background: var(--panel2); overflow: hidden; }
    .pc-meter-fill { display: block; height: 100%; }
    .pc-fill-bull { background: var(--green); }
    .pc-fill-neutral-bull { background: #7fd4b0; }
    .pc-fill-neutral { background: var(--gold); }
    .pc-fill-bear { background: var(--red); }
    .pc-meta { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .pc-meta b { color: var(--text); font-weight: 600; }
    .pc-rationale { margin: 6px 0; padding-left: 18px; font-size: 13px; }
    .pc-rationale li { margin: 3px 0; line-height: 1.5; }
    .pc-delta { font-size: 12.5px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 6px; line-height: 1.55; }
    .pc-delta b { color: var(--text); }

    /* ---- View tabs (the 7-view IA) ---- */
    .view-tabs {
      position: sticky;
      top: 0;
      z-index: 14;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      -webkit-overflow-scrolling: touch;
      margin-bottom: 16px;
      padding: 10px 12px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(11, 16, 32, 0.94);
      backdrop-filter: blur(10px);
      scrollbar-width: none;
    }
    .view-tabs::-webkit-scrollbar { display: none; }

    .view-tab {
      flex: 0 0 auto;
      display: inline-flex;
      flex-direction: column;
      gap: 2px;
      padding: 8px 14px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
    }
    .view-tab .view-tab-hint {
      font-size: 11px;
      font-weight: 500;
      opacity: 0.72;
      white-space: nowrap;
    }
    .view-tab:hover { color: var(--text); background: rgba(255, 255, 255, 0.04); }
    .view-tab[aria-selected="true"] {
      color: #eef5ff;
      background: rgba(120, 167, 255, 0.16);
      border-color: rgba(120, 167, 255, 0.34);
    }
    .view-tab:focus-visible {
      outline: 2px solid var(--accent, #7dd3fc);
      outline-offset: 2px;
    }

    /* display:none (not visibility) is deliberate: it is what actually collapses the
       page height from ~14,000px to a few thousand. Leaflet needs invalidateSize() when
       the atlas view becomes visible again — see onEnter in app.js. */
    .view[hidden] { display: none; }
    .view { display: block; }

    /* ---- Empty states for data we do not have ---- */
    .empty-state-block {
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      border: 1px dashed rgba(148, 163, 184, 0.34);
      background: rgba(255, 255, 255, 0.02);
      padding: 22px 20px;
    }
    .empty-state-block + .empty-state-block { margin-top: 16px; }

    .empty-state-hatch {
      position: absolute;
      inset: 0;
      opacity: 0.08;
      background-image: repeating-linear-gradient(
        45deg, transparent 0 9px, currentColor 9px 10px
      );
      pointer-events: none;
    }
    .empty-state-body { position: relative; }
    .empty-state-body h3 { margin: 8px 0 6px; font-size: 16px; color: var(--text); }

    .empty-state-tag {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .is-undisclosed .empty-state-tag { background: rgba(251, 113, 133, 0.16); color: #fda4af; }
    .is-gap .empty-state-tag { background: rgba(246, 196, 83, 0.16); color: #fcd34d; }

    .empty-state-why { margin: 0 0 8px; color: var(--muted); font-size: 13px; line-height: 1.7; }
    .empty-state-needs { margin: 0 0 10px; color: var(--muted); font-size: 13px; line-height: 1.7; }
    .empty-state-needs b { color: #dbe7ff; }
    .empty-state-have { font-size: 13px; color: var(--muted); line-height: 1.7; }
    .empty-state-have b { color: #dbe7ff; }
    .empty-state-have ul { margin: 6px 0 0; padding-left: 18px; }
    .empty-state-have li { margin-bottom: 4px; }

    /* ---- Gap register (method view) ---- */
    .gap-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .gap-table th, .gap-table td {
      text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line);
      vertical-align: top; line-height: 1.65;
    }
    .gap-table th { color: var(--muted); font-weight: 600; white-space: nowrap; }
    .gap-pill {
      display: inline-block; padding: 2px 9px; border-radius: 999px;
      font-size: 11px; font-weight: 700; white-space: nowrap;
    }
    .gap-pill.is-undisclosed { background: rgba(251, 113, 133, 0.16); color: #fda4af; }
    .gap-pill.is-gap { background: rgba(246, 196, 83, 0.16); color: #fcd34d; }

    /* ---- Charts (charts/kit.js) ----
       No chart measures its container. Each SVG is authored in a fixed viewBox and scaled
       here by CSS alone, because charts render inside `hidden` view panels where every
       element is 0 wide, and because #app carries a ResizeObserver that posts a new iframe
       height to the parent — a width-derived height would feed back through the parent and
       oscillate. `height:auto` on the SVG is therefore driven by the viewBox aspect ratio,
       never by JS.

       `axis-*` is NOT used as a prefix here: it is already taken by the status badges. */
    :root {
      --chart-grid: rgba(148, 163, 184, 0.16);
      --chart-tick: #8f9dbd;
      --chart-rowlabel: #c3cee6;
      --chart-bar-track: rgba(148, 163, 184, 0.1);
    }

    /* .card carries no padding of its own; each variant supplies it. The supply / cost /
       catalysts cards used to rely on .empty-state-block's padding, which stops working the
       moment they also hold a kicker and a chart. */
    .view-card { padding: 20px 22px 22px; }
    .view-card > .section-kicker { margin-bottom: 14px; }

    .chart {
      display: flex;
      flex-direction: column;
      margin: 0 0 18px;
      padding: 18px 20px 16px;
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    .chart:last-child { margin-bottom: 0; }

    .chart-head { margin-bottom: 10px; }
    .chart-titlebar {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 12px; flex-wrap: wrap;
    }
    .chart-title { margin: 4px 0 0; font-size: 16px; color: var(--text); }
    .chart-unit {
      font-size: 11px; font-weight: 700; letter-spacing: .02em;
      padding: 2px 9px; border-radius: 999px;
      background: rgba(120, 167, 255, 0.14); color: #b9d0ff;
    }
    .chart-note { margin: 8px 0 0; font-size: 13px; color: var(--muted); line-height: 1.7; }

    .chart-plot { position: relative; margin: 6px 0 12px; }
    .chart-svg { display: block; width: 100%; height: auto; font-variant-numeric: tabular-nums; }

    /* x/y charts cannot compress below ~720px without the axis labels colliding. The iframe
       is scrolling="no", so page-level overflow is CLIPPED, not scrollable — the chart gets
       its own scroller, the same pattern .tablewrap uses for the wide project table. */
    .chart-scroll {
      position: relative; margin: 6px 0 4px;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
    }
    .chart-scroll .chart-svg { min-width: 660px; }

    .chart-grid { stroke: var(--chart-grid); stroke-width: 1; }
    .chart-tick { fill: var(--chart-tick); font-size: 12px; }
    .chart-rowlabel { fill: var(--chart-rowlabel); font-size: 13px; }
    .chart-value { fill: var(--text); font-size: 13px; font-weight: 600; }
    /* Text sitting ON a filled bar, not on the panel. The page's light-on-dark defaults
       invert here: --text on a #38bdf8 fill is barely legible. Dark ink clears 7:1 against
       every fill the charts use — which is also why 其他 is #94a3b8 and not #64748b. */
    .chart-on-fill { fill: #0b1020; font-size: 13px; font-weight: 700; }
    .chart-on-fill-dim { fill: rgba(11, 16, 32, 0.74); font-size: 12px; font-weight: 600; }
    .chart-glyph { font-size: 12px; }
    .chart-bar-track { fill: var(--chart-bar-track); }
    .chart-refline { stroke: #a8b2cc; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .chart-reflabel { fill: #a8b2cc; font-size: 11px; }
    .chart-series-line { fill: none; stroke-width: 2.5; stroke-linejoin: round; }

    .chart-legend {
      display: flex; flex-wrap: wrap; gap: 6px 18px;
      margin: 2px 0 10px; font-size: 12px; color: var(--muted);
    }
    .chart-legend-item { display: inline-flex; align-items: center; gap: 7px; }
    .chart-swatch { width: 12px; height: 12px; border-radius: 3px; }
    /* The hatch is the same 45° pattern the empty states use, so "provisional / not yet
       real" means one thing across the page. */
    .chart-swatch[data-hatch] {
      background-image: repeating-linear-gradient(45deg,
        transparent 0 3px, rgba(255, 255, 255, .5) 3px 4px);
    }

    /* Empty chart: identical box, hatched plot area. Height comes from the chart it
       replaces so switching between a drawn and an undrawn chart never moves the page. */
    .chart-plot-empty {
      display: grid; place-items: center;
      min-height: var(--chart-empty-h, 300px);
      border: 1px dashed var(--line); border-radius: 12px;
      overflow: hidden;
    }
    .chart-empty-body {
      position: relative; max-width: 60ch; padding: 20px 24px; text-align: center;
    }
    .chart-is-empty .chart-title { color: var(--muted); }

    /* Screen-reader data mirror. role="img" + aria-label says what the chart IS; only the
       table gives the numbers a sighted reader can already read off the bars. */
    .chart-a11y {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    @media (max-width: 640px) {
      .chart { padding: 14px 12px 12px; }
      .chart-title { font-size: 15px; }
    }

    /* ---- Metric envelopes (components/metric.js) ----
       Every tile is the same height whether or not it has a number: a missing metric keeps
       its frame and states WHY it is missing. Collapsing empties would make the grid
       shorter exactly when there is more to explain, and would move the page height
       around under the iframe height contract. */
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(268px, 1fr));
      gap: 14px;
    }

    .metric-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 176px;
      padding: 15px 16px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.022);
    }

    .metric-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .metric-label {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      color: #dbe7ff;
      line-height: 1.45;
    }

    .metric-chips { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }

    .metric-chip {
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
      background: rgba(148, 163, 184, 0.13);
      color: #9fb0d4;
    }

    .metric-kind-observed { background: rgba(74, 222, 128, 0.13); color: #86efac; }
    .metric-kind-consensus { background: rgba(96, 165, 250, 0.14); color: #93c5fd; }
    .metric-kind-company_guidance { background: rgba(167, 139, 250, 0.14); color: #c4b5fd; }
    .metric-kind-own_calc { background: rgba(246, 196, 83, 0.15); color: #fcd34d; }
    .metric-kind-assumption { background: rgba(148, 163, 184, 0.15); color: #cbd5e1; }

    .metric-fresh-aging { background: rgba(246, 196, 83, 0.17); color: #fcd34d; }
    .metric-fresh-stale { background: rgba(251, 113, 133, 0.17); color: #fda4af; }

    .metric-value { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
    .metric-number {
      font-size: 27px;
      font-weight: 750;
      letter-spacing: -0.02em;
      color: #f4f8ff;
      font-variant-numeric: tabular-nums;
    }
    .metric-unit { font-size: 12px; color: var(--muted); }

    .metric-null {
      position: relative;
      flex: 1;
      border-radius: 10px;
      padding: 11px 12px;
      background-image: repeating-linear-gradient(45deg, transparent 0 9px, currentColor 9px 10px);
      background-color: rgba(255, 255, 255, 0.015);
    }
    .metric-null > * { position: relative; }
    .metric-null.is-undisclosed { color: rgba(251, 113, 133, 0.5); }
    .metric-null.is-gap { color: rgba(246, 196, 83, 0.5); }

    .metric-null-tag {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 700;
    }
    .is-undisclosed .metric-null-tag { background: rgba(251, 113, 133, 0.2); color: #fda4af; }
    .is-gap .metric-null-tag { background: rgba(246, 196, 83, 0.2); color: #fcd34d; }

    .metric-null-why {
      margin: 7px 0 0;
      font-size: 11.5px;
      line-height: 1.65;
      color: var(--muted);
    }

    .metric-note { margin: 0; font-size: 11.5px; line-height: 1.6; color: var(--muted); }

    .metric-foot {
      margin-top: auto;
      padding-top: 9px;
      border-top: 1px solid var(--line);
      font-size: 11px;
      line-height: 1.6;
      color: #8594ba;
    }
    .metric-basis { margin-bottom: 3px; }
    .metric-basis b { color: #9fb0d4; font-weight: 600; margin-right: 4px; }
    .metric-prov { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
    .metric-prov a { color: #93c5fd; text-decoration: none; }
    .metric-prov a:hover { text-decoration: underline; }
    .metric-dot { opacity: 0.5; }

    .market-unavailable {
      margin: 0;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px dashed rgba(251, 113, 133, 0.34);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    @media (max-width: 640px) {
      .view-tabs { padding: 8px; gap: 6px; }
      .view-tab { padding: 7px 11px; font-size: 12px; }
      .view-tab .view-tab-hint { display: none; }
      .gap-table { display: block; overflow-x: auto; }
    }
  </style>
</head>
<body>
  <div class="wrap" id="app">
    <header class="page-header">
      <div class="card hero">
        <div class="hero-topbar">
          <div class="eyebrow" id="heroEyebrow">Lithium Research 2026</div>
        </div>
        <h1 id="heroTitle">全球锂资源项目地图与数据库（2026）</h1>
        <p id="heroIntro1"></p>
        <p id="heroIntro2"></p>
        <div class="badge-row" id="heroBadges"></div>
        <div class="resource-links">
          <a class="resource-link" href="/data/global-lithium-database-2026.csv" download id="resourceCsvLink"></a>
          <a class="resource-link" href="/data/global-lithium-key-findings-2026.md" download id="resourceMdLink"></a>
        </div>
      </div>
    </header>

    <nav class="view-tabs" id="viewTabs" role="tablist" aria-label="报告视图"></nav>

    <main id="viewHost">

      <section class="view" data-view="cockpit" id="view-cockpit" role="tabpanel" aria-labelledby="tab-cockpit">
        <div class="side-stack">
        <div class="card stats" id="statsSection">
          <div class="stat">
            <div class="k" id="statProjectLabel"></div>
            <div class="v" id="statProjectCount">--</div>
          </div>
          <div class="stat">
            <div class="k" id="statCountryLabel"></div>
            <div class="v" id="statCountryCount">--</div>
          </div>
          <div class="stat">
            <div class="k" id="statOperatingLabel"></div>
            <div class="v" id="statOperatingCount">--</div>
            <div class="sub" id="statOperatingSub"></div>
          </div>
          <div class="stat">
            <div class="k" id="statCurrentCapacityLabel"></div>
            <div class="v" id="statCurrentCapacity">--</div>
            <div class="sub" id="statCurrentCapacityUnit"></div>
          </div>
          <div class="stat">
            <div class="k" id="statPlannedCapacityLabel"></div>
            <div class="v" id="statPlannedCapacity">--</div>
            <div class="sub" id="statPlannedCapacityUnit"></div>
          </div>
          <div class="stat">
            <div class="k" id="statPipelineLabel"></div>
            <div class="v" id="statPipelineCount">--</div>
            <div class="sub" id="statPipelineSub"></div>
          </div>
        </div>

        <div class="card findings" id="findingsSection">
          <div class="section-kicker" id="priceCallKicker"></div>
          <div class="price-call" id="priceCall"></div>
          <div class="section-kicker" id="findingsKicker" style="margin-top:18px;"></div>
          <ol class="findings-list" id="findingsList"></ol>
          <div class="section-kicker" id="riskKicker" style="margin-top:18px;"></div>
          <div class="risk-grid" id="riskGrid"></div>
        </div>
      </div>

    <section class="card" id="keyMetricsSection">
      <div class="section-kicker" id="keyMetricsKicker"></div>
      <p class="section-note" id="keyMetricsNote"></p>
      <div id="keyMetricsGrid"></div>
    </section>

    <details class="card changelog-card" id="changelogSection" open>
      <summary class="changelog-summary">
        <span class="changelog-summary-main">
          <span class="section-kicker" id="changelogKicker"></span>
          <span class="changelog-latest" id="changelogLatest"></span>
        </span>
        <span class="changelog-hint" id="changelogHint"></span>
      </summary>
      <div class="changelog-diff" id="changelogDiff"></div>
      <div class="changelog-tablewrap">
        <table class="changelog-table">
          <thead>
            <tr id="changelogHead"></tr>
          </thead>
          <tbody id="changelogBody"></tbody>
        </table>
      </div>
    </details>

    <section class="card updates-section" id="researchUpdatesSection">
      <div class="updates-header">
        <div class="section-kicker" id="updatesKicker"></div>
        <h2 id="updatesTitle"></h2>
        <p id="updatesSubtitle"></p>
      </div>
      <div class="updates-grid" id="updatesGrid"></div>
    </section>

      </section>

      <!-- Charts and gap placeholders are siblings by design: each view shows what we CAN
           draw first, then states what is still missing underneath. Separate slots so the
           two renderers (renderCharts / renderGapViews) never overwrite one another. -->
      <section class="view" data-view="supply" id="view-supply" role="tabpanel" aria-labelledby="tab-supply" hidden>
        <div class="card view-card" id="supplySection">
          <div class="section-kicker">未来供给</div>
          <div id="supplyChartSlot"></div>
          <div id="supplyGapSlot"></div>
        </div>
      </section>

      <section class="view" data-view="cost" id="view-cost" role="tabpanel" aria-labelledby="tab-cost" hidden>
        <div class="card view-card" id="costSection">
          <div class="section-kicker">成本曲线与价格敏感性</div>
          <div id="costChartSlot"></div>
          <div id="costGapSlot"></div>
        </div>
      </section>

      <section class="view" data-view="equities" id="view-equities" role="tabpanel" aria-labelledby="tab-equities" hidden>

    <section class="card company-section" id="companyResearchSection">
      <div class="company-header">
        <div class="section-kicker" id="companyKicker"></div>
        <h2 id="companyTitle"></h2>
        <p id="companySubtitle"></p>
      </div>
      <div class="company-subnav" id="companySubnav"></div>

      <div class="company-block" id="quickTakeSection">
        <div class="company-block-header">
          <h2 id="quickTakeTitle"></h2>
          <p id="quickTakeSubtitle"></p>
        </div>
        <div class="company-summary-grid" id="quickTakeGrid"></div>
        <div class="section-note" id="quickTakeNote"></div>
      </div>

      <div class="company-block" id="domesticEquitiesSection">
        <div class="company-block-header">
          <h2 id="domesticTitle"></h2>
          <p id="domesticSubtitle"></p>
        </div>
        <!-- Sits ABOVE the table on purpose: the 26E PE column below is computed from an
             April consensus that five of these ten names have already invalidated, so the
             coverage chart has to be read first for the table to be read correctly. -->
        <div id="coverageChartSlot"></div>
        <div class="company-tablewrap">
          <table class="company-table" id="domesticTable">
            <thead>
              <tr id="domesticTableHead"></tr>
            </thead>
            <tbody id="domesticTableBody"></tbody>
          </table>
        </div>
        <div class="section-note" id="domesticNote"></div>
      </div>

      <div class="company-block" id="globalEquitiesSection">
        <div class="company-block-header">
          <h2 id="globalTitle"></h2>
          <p id="globalSubtitle"></p>
        </div>
        <div class="company-tablewrap">
          <table class="company-table" id="globalTable">
            <thead>
              <tr id="globalTableHead"></tr>
            </thead>
            <tbody id="globalTableBody"></tbody>
          </table>
        </div>
        <div class="section-note" id="globalNote"></div>
      </div>

      <div class="company-block" id="resourceMatrixSection">
        <div class="company-block-header">
          <h2 id="matrixTitle"></h2>
          <p id="matrixSubtitle"></p>
        </div>
        <div class="company-tablewrap">
          <table class="company-table matrix-table" id="matrixTable">
            <thead>
              <tr id="matrixTableHead"></tr>
            </thead>
            <tbody id="matrixTableBody"></tbody>
          </table>
        </div>
      </div>

      <div class="company-block" id="focusVariablesSection">
        <div class="company-block-header">
          <h2 id="focusTitle"></h2>
          <p id="focusSubtitle"></p>
        </div>
        <div class="focus-grid" id="focusGrid"></div>
      </div>

      <div class="company-block" id="rankingSection">
        <div class="company-block-header">
          <h2 id="rankingTitle"></h2>
          <p id="rankingSubtitle"></p>
        </div>
        <div class="ranking-grid" id="rankingGrid"></div>
        <div class="final-callout">
          <h3 id="finalCallTitle"></h3>
          <p id="finalCallBody"></p>
        </div>
      </div>
    </section>

      </section>

      <section class="view" data-view="atlas" id="view-atlas" role="tabpanel" aria-labelledby="tab-atlas" hidden>

    <div class="card" id="projectMapSection">
      <div class="toolbar">
        <input id="searchBox" />
        <select id="statusFilter"></select>
        <select id="countryFilter"></select>
        <select id="structureFilter"></select>
        <select id="sortFilter"></select>
      </div>
      <div class="toolbar-meta">
        <div class="result-summary" id="resultSummary"></div>
      </div>
      <div class="legend" id="legend"></div>
      <div id="loadingNote" class="loading-note"></div>
      <div id="errorNote" class="error-note" hidden></div>
      <div class="map-regions" id="mapRegions"></div>
      <div class="mapbox">
        <div id="map"></div>
        <!-- aria-modal="false" on purpose: this is a non-blocking side panel. Claiming
             true would oblige a focus trap and an inert background, which is Phase 7. -->
        <aside id="projectDrawer" class="project-drawer" role="dialog" aria-modal="false"
               aria-labelledby="drawerTitle" hidden></aside>
      </div>
      <div id="unmappedNote" class="unmapped-note" hidden></div>
    </div>

    <div class="card tablewrap" id="projectDatabaseSection">
      <div class="table-title">
        <h2 id="tableTitle"></h2>
        <p id="tableSubtitle"></p>
      </div>
      <!-- role=radiogroup, not a row of toggle buttons: picking a column group is a
           single choice, and aria-checked says so in a way aria-pressed cannot. -->
      <div class="column-groups" id="columnGroups" role="radiogroup" aria-label="表格列组"></div>
      <p class="table-scroll-hint" id="tableScrollHint"></p>
      <div class="table-scroll">
        <table id="dataTable">
          <thead>
            <tr id="dataTableHead"></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

      </section>

      <section class="view" data-view="catalysts" id="view-catalysts" role="tabpanel" aria-labelledby="tab-catalysts" hidden>
        <div class="card view-card" id="catalystsSection">
          <div class="section-kicker">催化剂与预警</div>
          <div id="catalystsChartSlot"></div>
          <div id="catalystsGapSlot"></div>
        </div>
      </section>

      <section class="view" data-view="method" id="view-method" role="tabpanel" aria-labelledby="tab-method" hidden>
        <div class="card footnote" id="methodologySection"></div>
        <div class="card" id="gapRegisterSection"></div>
      </section>

    </main>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"

  ></script>
  <script type="module" src="./app.js?v=2026-08-11"></script>
