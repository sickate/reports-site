# Initial configuration (HTTP only)
# certbot will automatically add SSL configuration

server {
    listen 80;
    listen [::]:80;
    server_name reports.instap.net;

    # Document root
    root /var/www/reports;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hand-written research-topic modules must revalidate.
    #
    # Vite's /assets/* filenames are content-hashed, so "immutable" is safe for them.
    # Files under /research-topics/ are authored by hand and keep STABLE names, so the
    # generic rule below would pin them in browser caches for a year: a returning visitor
    # would silently keep running last year's code with no 404, no console error and no
    # visible symptom. nginx matches regex locations in definition order (first match
    # wins), so this block must stay ABOVE the generic asset block.
    #
    # add_header does not merge across levels — declaring any header here drops every
    # server-level one, so the security headers are repeated verbatim.
    location ~* ^/research-topics/.*\.(js|css)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HTML / SPA routes / data files must always revalidate (etag), so report
    # updates are never masked by heuristic browser caching. Hashed /assets keep
    # their own "immutable" (the location block above overrides this inheritance).
    add_header Cache-Control "no-cache" always;

    # Disable access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Logging
    access_log /var/log/nginx/reports.instap.net.access.log;
    error_log /var/log/nginx/reports.instap.net.error.log;
}
